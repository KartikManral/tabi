145:{title:'Giving and Receiving',place:'A gift shop in Gion',focus:'あげる, もらう, くれる',
 story:'You buy a small fan for Mika, and she buys a pair of chopsticks for you. In Japanese, who gives and who receives changes the verb.',
 note:{title:'Give and receive',html:"<p><b>あげる</b> I give (to someone else). <b>もらう</b> I receive. <b>くれる</b> someone gives to me. <b>わたしは ともだちに おみやげを あげました。</b> I gave my friend a souvenir. <b>ともだちに おみやげを もらいました。</b> I received a souvenir from a friend. <b>ともだちが おみやげを くれました。</b> My friend gave me a souvenir.</p>"},
 teaser:'The temple pagoda is lit up at night. Tomorrow: let us.'},
146:{title:'Let\'s Go!',place:'Toji Temple',focus:'volitional form: let\'s, I will',
 story:'The five-storey pagoda of Toji is the tallest in Japan. Mika points at it and says, the quick way to invite someone is a single word.',
 note:{title:'The volitional form',html:"<p>The volitional form says let's or I will. <b>る-verbs:</b> drop る, add <b>よう</b>: たべる → <b>たべよう</b>. <b>う-verbs:</b> change the last sound to its お-sound and add う: いく → <b>いこう</b>, のむ → <b>のもう</b>, はなす → <b>はなそう</b>. Irregular: する → <b>しよう</b>, くる → <b>こよう</b>. <b>あした いこうと おもいます。</b> I am thinking of going tomorrow. Casual invitation: <b>いっしょに たべよう!</b></p>"},
 teaser:'In the morning you rent kimono. Tomorrow: polite requests.'},
147:{title:'Could You Help?',place:'A kimono rental shop',focus:'〜て くれませんか, 〜ましょうか',
 story:'Kimono rental takes an hour: obi, sandals, a bag. Mika asks the staff if they can do something for her, and the polite phrase is worth memorising.',
 note:{title:'Polite requests and offers',html:"<p>て-form + <b>くれませんか</b>: <b>ちょっと まって くれませんか。</b> Could you wait a moment? More polite: <b>〜て いただけませんか</b>. Offer to do something: <b>〜ましょうか</b>: <b>もちましょうか。</b> Shall I carry it?</p>"},
 teaser:'You are hungry. Tomorrow: too much.'},
148:{title:'Too Much Kaiseki',place:'A kaiseki restaurant',focus:'〜すぎます, 〜やすい, 〜にくい',
 story:'Kaiseki is a meal in many tiny courses. By the eighth you are full. The taste is light and delicate, and the chopsticks are thin and hard to use.',
 note:{title:'Too much, easy, hard',html:"<p>ます-stem + <b>すぎます</b>: <b>たべすぎました。</b> I ate too much. For い-adjectives drop い: <b>たかすぎます</b> too expensive. ます-stem + <b>やすい</b> easy to: <b>よみやすい</b>. ます-stem + <b>にくい</b> hard to: <b>あるきにくい</b>.</p>"},
 teaser:'The streets grow quiet. Tomorrow: a last evening.'},
149:{title:'A Last Evening in Gion',place:'Gion at night',focus:'review: Kyoto patterns',

167:{title:'In Order To',place:'A study cafe',focus:'〜ために, 〜ように: purpose',

168:{title:'It Should Come',place:'Umeda Station',focus:'〜はずです: should be',

170:{title:'It Happened to Me',place:'A crowded street',focus:'passive form',
 story:'Someone nearby shouts that a bag has been stolen. Mika says the police are coming. Japanese has a special form for what happens to you.',
 note:{title:'The passive form',html:"<p><b>る-verbs:</b> drop る, add <b>られる</b>: たべる → <b>たべられる</b>. <b>う-verbs:</b> change the last sound to its あ-sound and add <b>れる</b>: かく → <b>かかれる</b>, よむ → <b>よまれる</b>, かう → <b>かわれる</b>. する → <b>される</b>, くる → <b>こられる</b>. <b>わたしは せんせいに ほめられました。</b> I was praised by the teacher. The passive of る-verbs looks like the potential; context tells you which.</p>"},
 teaser:'The thief is caught. Tomorrow: making someone do something.'},
171:{title:'Let Me Cook',place:'A cooking class',focus:'causative form',
 story:'A cooking class: the teacher makes everyone cut onions. You ask if you can taste the sauce, and she lets you.',
 note:{title:'The causative form',html:"<p><b>る-verbs:</b> drop る, add <b>させる</b>: たべる → <b>たべさせる</b>. <b>う-verbs:</b> change the last sound to its あ-sound and add <b>せる</b>: かく → <b>かかせる</b>, のむ → <b>のませる</b>. する → <b>させる</b>, くる → <b>こさせる</b>. <b>せんせいは がくせいに ほんを よませました。</b> The teacher made the students read a book. Asking permission: <b>やすませて ください。</b> Please let me rest.</p>"},
 teaser:'The class ends with a bow. Tomorrow: very polite Japanese.'},
172:{title:'Customer Language',place:'A department store',focus:'keigo basics',
 story:'In a department store every sentence is a bow. Mika tells you that you do not need to speak it yet, but you must recognise it.',
 note:{title:'Polite shop language',html:"<p><b>いらっしゃいませ</b> welcome. <b>かしこまりました</b> certainly. <b>おまたせしました</b> sorry to keep you waiting. Honorific: <b>お + ます-stem + に なります</b>: <b>おかえりに なります</b>. Humble: <b>お + ます-stem + します</b>: <b>おもちします</b> I'll carry it. <b>〜て いただきます</b> I humbly receive: <b>おしえて いただきます。</b></p>"},
 teaser:'You buy a gift and a small bag. Tomorrow: if.'},
173:{title:'If You Try',place:'A temple on the edge of town',focus:'ば form: if',
 story:'A monk says that if you keep going, you will arrive. In Japanese, that is a different if from the one you learned in Kyoto.',
 note:{title:'The ば form',html:"<p><b>る-verbs:</b> drop る, add <b>れば</b>: たべる → <b>たべれば</b>. <b>う-verbs:</b> change the last sound to its え-sound and add <b>ば</b>: かく → <b>かけば</b>, のむ → <b>のめば</b>. する → <b>すれば</b>, くる → <b>くれば</b>, ある → <b>あれば</b>. <b>いそげば まに あいます。</b> If you hurry you will make it. <b>よければ</b> if that's fine with you. ば states a general condition; たら is more personal.</p>"},
 teaser:'He bows and walks off. Tomorrow: even though.'},
174:{title:'Although, and Besides',place:'A busy ramen shop',focus:'〜のに, 〜し',
 story:'The shop has a line out the door even though it is raining. Mika says it is cheap, it is good, and it is close: three reasons at once.',

/* ---- dates: a "day" rolls over at 3:00 am so late-night study still counts for the day you started ---- */
const ROLL_H=3;
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>dkey(new Date(Date.now()-ROLL_H*3600e3));
const keyDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12);};
const shiftKey=(k,n)=>{const d=keyDate(k);d.setDate(d.getDate()+n);return dkey(d);};
const dayNum=k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
function msToRollover(){const n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),ROLL_H,0,0);if(t<=n)t.setDate(t.getDate()+1);return t-n;}

/* ---- state ---- */
const LS_KEY='tabi.v1';
let lsKey=LS_KEY;
let S=null,dbDoc=null,saveMode='local',dirty=false,saving=false,commitTimer=null;
const newState=()=>({v:1,created:Date.now(),updated:0,day0:false,log:{},done:{},items:{},yokai:{},stats:{answers:0,correct:0},speed:null,reports:[]});
function loadLocal(k){try{const t=localStorage.getItem(k||lsKey);return t?JSON.parse(t):null;}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem(lsKey,JSON.stringify(S));}catch(e){}}
function touch(){S.updated=Date.now();dirty=true;clearTimeout(commitTimer);commitTimer=setTimeout(commit,1200);}
async function commit(){
  saveLocal();
  if(!dirty)return;
  if(!dbDoc){paintSave();return;}
  if(saving){commitTimer=setTimeout(commit,900);return;}
  saving=true;dirty=false;
  try{await dbDoc.set({json:JSON.stringify(S),updated:S.updated});saveMode='cloud';}
  catch(e){dirty=true;saveMode='retry';}
  saving=false;paintSave();
}
function paintSave(){
  const el=$('#savestate');if(!el)return;
  el.className='sav'+(saveMode==='local'||saveMode==='retry'?' warn':'');
  el.textContent=saveMode==='cloud'?'Progress saved to your account.':saveMode==='retry'?'Could not reach your account just now. Saved on this device and retrying.':SAVE_NOTE;
}
let SAVE_NOTE='Progress is saved on this device only.';
async function initStorage(){
  let cloudDoc=null;
  if(typeof AUTH!=='undefined'&&AUTH.user&&AUTH.db){lsKey=LS_KEY+':'+AUTH.user.uid;cloudDoc=AUTH.db.collection('users').doc(AUTH.user.uid);}
  S=loadLocal();
  if(cloudDoc){
    try{
      const snap=await withTimeout(cloudDoc.get(),10000);
      let remote=null;if(snap.exists){try{remote=JSON.parse(snap.data().json);}catch(e){}}
      if(remote&&(!S||(remote.updated||0)>=(S.updated||0)))S=remote;
      else if(!remote&&!S){const g=loadLocal(LS_KEY);if(g){S=g;dirty=true;}}   /* first sign-in: keep what the guest session had */
      else if(S&&(!remote||(S.updated||0)>(remote.updated||0)))dirty=true;
      dbDoc=cloudDoc;saveMode='cloud';
    }catch(e){SAVE_NOTE='Could not reach your account just now, so this visit saves on this device only.';}
  }else{
    try{
      const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
      if(use){
        const [db,user]=await Promise.all([use('db'),use('user')]);
        const id=(db&&user)?await user.id():null;
        if(db&&id){
          const doc=db.collection('data/users/'+id).doc('save');
          try{
            const snap=await withTimeout(doc.get(),10000);
            if(snap.exists){
              let remote=null;try{remote=JSON.parse(snap.data().json);}catch(e){}
              if(remote&&(!S||(remote.updated||0)>=(S.updated||0)))S=remote;
            }
            dbDoc=doc;saveMode='cloud';
            if(S&&(!snap.exists||(S.updated||0)>((snap.exists&&JSON.parse(snap.data().json).updated)||0))){dirty=true;}
          }catch(e){SAVE_NOTE='Could not reach your saved account progress, so this visit saves on this device only.';}
        }else{SAVE_NOTE='Progress is saved on this device only (account saving needs a signed-in view).';}
      }else if(typeof AUTH!=='undefined'&&AUTH.configured){SAVE_NOTE='Progress is saved on this device only. Sign in with Google to keep it across devices.';}
    }catch(e){}
  }
  if(!S){S=newState();touch();}
  S.log=S.log||{};S.done=S.done||{};S.items=S.items||{};S.yokai=S.yokai||{};S.stats=S.stats||{answers:0,correct:0};S.reports=S.reports||[];
  if(dirty)commit();
}

/* ---- progress helpers ---- */
const isDone=n=>!!S.done[n];
function doneUpTo(){let n=0;while(S.done[n+1])n++;return n;}
const nextDay=()=>{let n=1;while(S.done[n])n++;return n;};
const logToday=()=>S.log[todayKey()];
const coreDoneToday=()=>{const l=logToday();return !!(l&&(l.core||l.lantern));};
function streak(){
  const t=todayKey();let k=S.log[t]&&(S.log[t].core||S.log[t].lantern)?t:shiftKey(t,-1);let cur=0;
  while(S.log[k]&&(S.log[k].core||S.log[k].lantern)){cur++;k=shiftKey(k,-1);}
  const keys=Object.keys(S.log).filter(k=>S.log[k].core||S.log[k].lantern).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{run=(prev&&shiftKey(prev,1)===k)?run+1:1;best=Math.max(best,run);prev=k;});
  return {cur,best,total:keys.length,full:keys.filter(k=>S.log[k].core).length,lantern:keys.filter(k=>!S.log[k].core&&S.log[k].lantern).length};
}
function poolChars(upto){return KANA.filter(k=>k.day<=upto).map(k=>k.c);}
function poolWords(upto){return WORDS.filter(w=>w.day<=upto);}
function tokensUpTo(upto){return uniq(poolWords(upto).map(w=>w.j).concat(GRAMMAR_TOKENS.filter(g=>g[0]<=upto).map(g=>g[1])));}

/* ---- spaced repetition (Leitner boxes) + yokai ---- */
const BOX_DAYS=[0,1,2,4,8,16];
function itemOf(id){return S.items[id]||(S.items[id]={box:0,due:0,seen:0,right:0,wrong:0,last:0});}
function gradeItem(id,ok){
  const it=itemOf(id),t=dayNum(todayKey());it.seen++;it.last=Date.now();
  if(ok){it.right++;it.box=Math.min(5,it.box+1);it.due=t+BOX_DAYS[it.box];}
  else{it.wrong++;it.box=1;it.due=t;}
}
const dueIds=()=>{const t=dayNum(todayKey());return Object.keys(S.items).filter(id=>S.items[id].due<=t&&S.items[id].seen>0).sort((a,b)=>S.items[a].due-S.items[b].due||S.items[a].box-S.items[b].box);};
const activeYokai=()=>Object.values(S.yokai).filter(y=>!y.gone).sort((a,b)=>b.misses-a.misses||(a.last||0)-(b.last||0));
const DEN_CAP=10;
function yokaiHit(id,meta){
  let y=S.yokai[id],fresh=false;
  if(!y){y=S.yokai[id]={id,kind:meta.kind,label:meta.label,en:meta.en||'',made:todayKey(),misses:0,right:[],gone:false,conf:{}};fresh=true;}
  else if(y.gone){y.gone=false;y.right=[];fresh=true;}
  y.misses++;y.last=Date.now();
  if(meta.conf)y.conf[meta.conf]=(y.conf[meta.conf]||0)+1;
  return fresh;
}
function yokaiRight(id){
  const y=S.yokai[id];if(!y||y.gone)return null;
  const t=todayKey();if(t===y.made||y.right.includes(t))return null;
  y.right.push(t);
  if(y.right.length>=3){y.gone=true;y.goneOn=t;return 'gone';}
  return 'progress';
}
const SES={sec:0,answers:0,correct:0,fresh:0,gone:0,start:Date.now()};
const resetSES=()=>{SES.sec=0;SES.answers=0;SES.correct=0;SES.fresh=0;SES.gone=0;SES.start=Date.now();};
function grade(q,ok,conf){
  S.stats.answers++;SES.answers++;if(ok){S.stats.correct++;SES.correct++;}
  gradeItem(q.item,ok);
  let res=null;
  if(ok){res=yokaiRight(q.item);if(res==='gone')SES.gone++;}
  else{if(yokaiHit(q.item,{kind:q.kind,label:q.label,en:q.en,conf}))SES.fresh++;}
  touch();return res;
}

/* ---- romaji to kana (for typing answers; Hepburn plus common IME spellings) ---- */
const R2K=(()=>{const m={};KANA.forEach(k=>{if(!m[k.r])m[k.r]=k.c;});Object.assign(m,{wo:'を',si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',di:'ぢ',du:'づ',dzu:'づ',ji:'じ'});
  const sm={a:'ゃ',u:'ゅ',o:'ょ'};
  [['ky','き'],['gy','ぎ'],['ny','に'],['hy','ひ'],['by','び'],['py','ぴ'],['my','み'],['ry','り'],['sy','し'],['ty','ち'],['zy','じ'],['jy','じ'],['dy','ぢ']].forEach(([p,k])=>Object.keys(sm).forEach(v=>{m[p+v]=k+sm[v];}));
  [['sh','し'],['ch','ち'],['j','じ']].forEach(([p,k])=>Object.keys(sm).forEach(v=>{m[p+v]=k+sm[v];}));
  return m;})();
const VOW=(()=>{const m={};KANA.forEach(k=>{if(k.script==='h'){const v=k.r.slice(-1);if('aiueo'.includes(v))m[k.c]=v;}});Object.assign(m,{'ゃ':'a','ゅ':'u','ょ':'o'});return m;})();
const VOWKANA={a:'あ',i:'い',u:'う',e:'え',o:'お'};
const toHira=s=>String(s).replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const toKata=s=>String(s).replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function toKataFold(s){ /* hiragana from the typing box -> katakana, with doubled vowels shown as the long-vowel line */
  const h=[...String(s)];let out='',pv='';
  h.forEach(c=>{const isV=VOWKANA.a===c||VOWKANA.i===c||VOWKANA.u===c||VOWKANA.e===c||VOWKANA.o===c;const v=isV?Object.keys(VOWKANA).find(k=>VOWKANA[k]===c):'';
    if(isV&&pv===v&&(v!=='o'||c==='お')){out+='ー';}else out+=toKata(c);
    pv=VOW[c]||(isV?v:'');});
  return out;
}
const R2K_PREFIX=(()=>{const s=new Set();Object.keys(R2K).forEach(k=>{for(let i=1;i<k.length;i++)s.add(k.slice(0,i));});return s;})();
const CONS='bcdfghjklmpqrstvwxyz';
function romajiToKana(str,final){
  const s=String(str).toLowerCase().replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ū/g,'uu').replace(/ē/g,'ee').replace(/ō/g,'ou');
  let out='',i=0,rest='';
  while(i<s.length){
    const c=s[i];
    if(c===' '){out+=' ';i++;continue;}
    if(/[぀-ゟ]/.test(c)){out+=c;i++;continue;}
    if(c==='-'||c==='ー'){out+='ー';i++;continue;}
    if(CONS.includes(c)&&((s[i+1]===c)||(c==='t'&&s.substr(i+1,2)==='ch'))){out+='っ';i++;continue;}
    if(c==='n'){
      const nx=s[i+1];
      if(nx==="'"){out+='ん';i+=2;continue;}
      if(nx==='n'){const n2=s[i+2];if(n2&&'aiueoy'.includes(n2)){out+='ん';i++;continue;}out+='ん';i+=2;continue;}
      if(nx===undefined){if(final){out+='ん';i++;continue;}rest='n';break;}
      if(!'aiueoy'.includes(nx)){out+='ん';i++;continue;}
    }
    let hit=null;
    for(const L of [3,2,1]){const k=s.substr(i,L);if(R2K[k]){hit=[k,R2K[k]];break;}}
    if(hit){out+=hit[1];i+=hit[0].length;continue;}
    const tail=s.slice(i);
    if(!final&&R2K_PREFIX.has(tail)){rest=tail;break;}
    out+=c;i++;
  }
  return {kana:out,rest};
}
const normAns=t=>String(t).replace(/[\s、。？！?!.,ー]/g,'');
const hasKata=t=>/[\u30a0-\u30ff]/.test(t);
function canon(s){ /* compare katakana words by sound: katakana->hiragana, ー and ou/ei folded */
  const h=[...toHira(String(s).replace(/[\s、。？！?!.,]/g,''))];let out='',pv='';
  h.forEach(c=>{
    if(c==='ー'){const k=VOWKANA[pv]||'';out+=k;return;}
    let x=c;if(c==='う'&&pv==='o')x='お';else if(c==='い'&&pv==='e')x='え';
    out+=x;const v=VOW[x];pv=v||(x==='あ'?'a':x==='い'?'i':x==='う'?'u':x==='え'?'e':x==='お'?'o':'');
  });
  return out;
}
function cmpAns(typed,answer){
  if(hasKata(answer))return canon(typed)===canon(answer);
  const fo=x=>x.replace(/おお/g,'おう'),a=normAns(answer),t=normAns(typed);
  if(a===t||fo(a)===fo(t))return true;
  return /^(こんにちは|こんばんは)$/.test(answer)&&t===a.slice(0,-1)+'わ';
}

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const YK_COL=['var(--indigo)','var(--seal)','var(--moss)','var(--amber)'];

function yokaiName(y){const h=hash(y.id);const base=y.kind==='kana'&&K[y.label]?K[y.label].r:(y.kind==='word'&&WORD[y.label]?WORD[y.label].r:(y.kind==='kanji'&&KJ[y.label]?KJ[y.label].m.split(',')[0]:(y.kind==='kword'&&KVW[y.id]?KVW[y.id].r:(y.kind==='conj'&&VERB[y.label]?VERB[y.label].r:'talk'))));return base.charAt(0).toUpperCase()+base.slice(1)+'-'+YK_SUF[h%YK_SUF.length];}
function yokaiSVG(y,size){

/* ---- the hanko seal ---- */
function sealSVG(big,small,size,cls){

/* ---- question builders ---- */
function distractKana(ch,pool,n,ok){
  const bad=new Set();
  pool=pool.filter(c=>K[c]&&K[c].script===K[ch].script);
  const conf=shuffle((CONF.find(g=>g.includes(ch))||[]).filter(c=>c!==ch&&pool.includes(c)&&ok(c)));
  const out=[];
  conf.slice(0,2).forEach(c=>out.push(c));
  shuffle(pool.filter(c=>c!==ch&&ok(c))).forEach(c=>{if(out.length<n&&!out.includes(c)&&!out.some(o=>K[o].r===K[c].r))out.push(c);});
  return out.slice(0,n);
}
function qK2R(ch,pool){
  const o=K[ch],d=distractKana(ch,pool,3,c=>K[c].r!==o.r);
  return {t:'k2r',item:'k:'+ch,kind:'kana',label:ch,en:'',prompt:{q:'What sound is this?',big:ch,cls:''},
    opts:shuffle([{v:o.r,ok:true,k:ch}].concat(d.map(c=>({v:K[c].r,ok:false,k:c})))),ocls:'',
    show:`<span class="j">${ch}</span> is “${o.r}”.`,hook:hookFor(ch),audio:ch};
}
function qR2K(ch,pool){

function qA2K(ch,pool){

/* ---- kanji questions ---- */
const poolKanji=upto=>KANJI.filter(k=>k.day<=upto);
const poolKV=upto=>KJ_ALLWORDS.filter(w=>w.day<=upto);
const firstM=m=>m.split(',')[0];
function qJ2M(k,pool){

function qM2J(k,pool){

function qV2R(w,pool){

    show:`<span class="j">${w.f}</span> is read <span class="j">${w.k}</span> (${esc(w.r)}), “${esc(w.en)}”.`,audio:w.k};

function qV2M(w,pool){
  const d=shuffle(pool.filter(x=>x.en!==w.en&&x.f!==w.f)).filter((x,i,a)=>a.findIndex(y=>y.en===x.en)===i).slice(0,3);
  return {t:'v2m',item:w.id,kind:'kword',label:w.f,en:w.en,prompt:{q:'What does it mean?',big:w.f,cls:'w',audioBtn:true},
    opts:shuffle([{v:w.en,ok:true}].concat(d.map(x=>({v:x.en,ok:false})))),ocls:'m',col:true,
    show:`<span class="j">${w.f}</span> (${w.k}, ${esc(w.r)}) means “${esc(w.en)}”.`,audio:w.k};

/* ---- verb-form questions ---- */
const poolVerbs=upto=>VERBS.filter(v=>v.day<=upto);
const availKinds=upto=>Object.keys(CONJ_DAY).filter(k=>CONJ_DAY[k]<=upto);
const CONJ_HINT={
  dict:'Drop ます. For る-verbs add る; for う-verbs move the い-sound to its う-sound (き→く, し→す, り→る, み→む).',
  nai:'る-verbs: drop る, add ない. う-verbs: change the last sound to its あ-sound (かく→かか, のむ→のま, かう→かわ), add ない. する→しない, くる→こない.',
  ta:'る-verbs: drop る, add た. う-verbs: く→いた, ぐ→いだ, す→した, う・つ・る→った, む・ぶ・ぬ→んだ. いく→いった.',
  pot:'る-verbs: drop る, add られる. う-verbs: change the last sound to its え-sound and add る (かく→かける, よむ→よめる, かう→かえる). する→できる, くる→こられる.',
  vol:'る-verbs: drop る, add よう. う-verbs: change the last sound to its お-sound and add う (いく→いこう, のむ→のもう). する→しよう, くる→こよう.',
  pas:'る-verbs: drop る, add られる. う-verbs: change the last sound to its あ-sound and add れる (かく→かかれる, のむ→のまれる, かう→かわれる). する→される, くる→こられる.',
  cau:'る-verbs: drop る, add させる. う-verbs: change the last sound to its あ-sound and add せる (かく→かかせる, のむ→のませる). する→させる, くる→こさせる.',
  ba:'る-verbs: drop る, add れば. う-verbs: change the last sound to its え-sound and add ば (かく→かけば, のむ→のめば). する→すれば, くる→くれば, ある→あれば.',
  te:'Like the た form, with て and で: く→いて, ぐ→いで, す→して, う・つ・る→って, む・ぶ・ぬ→んで. いく→いって.'};
function conjWrong(v,kind){
  const s=v.d.slice(0,-1),c=new Set();
  if(kind==='dict'){
    if(v.g==='3')poolVerbs(999).filter(x=>x.d!==v.d).forEach(x=>c.add(x.d));
    else{const base=v.masu.slice(0,-2),st=base.slice(0,-1);'るうくすむぶつぐ'.split('').forEach(e=>c.add(v.g==='2'?base+e:st+e));}
  }else if(kind==='nai'){
    c.add(v.d+'ない');c.add(v.stem+'ない');c.add(s+'らない');Object.values(CONJ_A).forEach(a=>c.add(s+a+'ない'));
  }else if(kind==='pot'){
    c.add(v.d+'れる');c.add(s+'られる');c.add(v.stem+'れる');Object.values(CONJ_E).forEach(e=>c.add(s+e+'る'));c.add(v.d+'ことが');
  }else if(kind==='pas'||kind==='cau'){
    const sfx=kind==='pas'?'れる':'せる',lg=kind==='pas'?'られる':'させる';
    c.add(s+lg);c.add(v.d+sfx);Object.values(CONJ_A).forEach(x=>c.add(s+x+sfx));c.add(v.stem+sfx);
  }else if(kind==='ba'){
    c.add(v.d+'ば');c.add(s+'れば');c.add(v.stem+'ば');Object.values(CONJ_E).forEach(e=>c.add(s+e+'ば'));c.add(v.nai.slice(0,-1)+'ければ');
  }else if(kind==='vol'){
    c.add(v.d+'よう');c.add(s+'よう');Object.values(CONJ_O).forEach(o=>c.add(s+o+'う'));c.add(v.stem+'う');
  }else{
    const ex=kind==='te'?'て':'た',exd=kind==='te'?'で':'だ';
    ['って','んで','いて','いで','して'].forEach(e=>c.add(s+(e.endsWith('で')?e.slice(0,-1)+exd:e.slice(0,-1)+ex)));
    c.add(s+ex);c.add(v.d+ex);
  }
  const ans=kind==='dict'?v.d:v[kind];
  c.delete(ans);
  return shuffle([...c].filter(x=>x!==ans)).slice(0,3);
}
function qConj(v,kind){
  const ans=kind==='dict'?v.d:v[kind];
  const pr=kind==='dict'?{q:'What is the dictionary form?',big:v.masu,cls:'w'}:{q:'What is the '+CONJ_NAME[kind]+' of this verb?',big:v.d,cls:'w'};
  return {t:'conj',item:'x:'+v.d+'|'+kind,kind:'conj',label:v.d,en:v.en+' ('+CONJ_NAME[kind]+')',prompt:pr,
    opts:shuffle([{v:ans,ok:true}].concat(conjWrong(v,kind).map(x=>({v:x,ok:false})))),ocls:'w',
    show:kind==='dict'?`<span class="j">${v.masu}</span> → <span class="j">${v.d}</span>, “${esc(v.en)}”.`:`The ${CONJ_NAME[kind]} of <span class="j">${v.d}</span> (${esc(v.en)}) is <span class="j">${ans}</span>.`,hook:CONJ_HINT[kind],audio:ans};
}
function qFromItem(id,upto){
  const pool=poolChars(upto),words=poolWords(upto);
  if(id.startsWith('k:')){const ch=id.slice(2);if(!K[ch])return null;const opts=[qK2R];if(!NO_REVERSE.has(ch))opts.push(qR2K);if(TTS.voice&&!NO_REVERSE.has(ch))opts.push(qA2K);return pick(opts)(ch,pool);}
  if(id.startsWith('w:')){const w=WORD[id.slice(2)];if(!w)return null;return (Math.random()<.5&&words.length>=4?qW2M:qM2W)(w,words);}
  if(id.startsWith('t:')){const y=S.yokai[id];return y?qTalk(y):null;}
  if(id.startsWith('x:')){const [d,kind]=id.slice(2).split('|'),v=VERB[d];if(!v||!CONJ_DAY[kind]||!(kind==='dict'||v[kind])||Math.max(v.day,CONJ_DAY[kind])>upto)return null;return qConj(v,kind);}
  if(id.startsWith('j:')){const k=KJ[id.slice(2)],p=poolKanji(upto);if(!k||k.day>upto||p.length<4)return null;return (Math.random()<.5?qJ2M:qM2J)(k,p);}
  if(id.startsWith('v:')){const w=KVW[id],p=poolKV(upto);if(!w||w.day>upto||p.length<4)return null;return (Math.random()<.5?qV2R:qV2M)(w,p);}
  return null;
}
function yokaiQs(max,upto){
  const qs=[];activeYokai().slice(0,DEN_CAP).slice(0,max).forEach(y=>{
    let q=null;
    if(y.kind==='talk')q=qTalk(y);else if(y.kind==='word'&&WORD[y.label]){const w=WORD[y.label];q=poolWords(upto).length>=4?(Math.random()<.5?qW2M(w,poolWords(upto)):qM2W(w,poolWords(upto))):qType(w);}
    else if(y.kind==='kanji'&&KJ[y.label]&&poolKanji(upto).length>=4){q=(Math.random()<.5?qJ2M:qM2J)(KJ[y.label],poolKanji(upto));}
    else if(y.kind==='kword'&&KVW[y.id]&&poolKV(upto).length>=4){q=(Math.random()<.5?qV2R:qV2M)(KVW[y.id],poolKV(upto));}
    else if(y.kind==='conj'&&VERB[y.label]){const kd=y.id.split('|')[1];if(Math.max(VERB[y.label].day,CONJ_DAY[kd])<=upto)q=qConj(VERB[y.label],kd);}
    else if(y.kind==='kana'&&K[y.label]){q=(Math.random()<.5||NO_REVERSE.has(y.label))?qK2R(y.label,poolChars(upto)):qR2K(y.label,poolChars(upto));}
    if(q){q.yokai=true;qs.push(q);}
  });
  return qs;
}
function reviewQs(n,upto,skip){
  const qs=[],seen=new Set(skip||[]);
  dueIds().forEach(id=>{if(qs.length<n&&!seen.has(id)){const q=qFromItem(id,upto);if(q){qs.push(q);seen.add(id);}}});
  const chars=shuffle(poolChars(upto)),words=shuffle(poolWords(upto));
  let guard=0;
  while(qs.length<n&&guard++<60){
    const pk=poolKanji(upto),pv=poolKV(upto),pvb=poolVerbs(upto),r=Math.random();
    const id=pvb.length>=6&&r>.62&&r<.8?(()=>{const kd=pick(availKinds(upto));const vs=pvb.filter(v=>kd==='dict'||v[kd]);return 'x:'+pick(vs).d+'|'+kd;})():pk.length>=4&&r<.25?'j:'+pick(pk).c:pv.length>=4&&r<.4?pick(pv).id:(words.length>=4&&r<.65)?pick(words).id:'k:'+pick(chars);
    if(seen.has(id))continue;const q=qFromItem(id,upto);if(q){qs.push(q);seen.add(id);}
  }
  return qs;
}
function lessonQuiz(day){
  const d=DAYS[day],pool=poolChars(day),words=poolWords(day),qs=[];
  const nc=d.chars;
  if(nc.length>8){nc.forEach(c=>qs.push(qK2R(c,pool)));shuffle(nc.filter(c=>!NO_REVERSE.has(c))).slice(0,6).forEach(c=>qs.push(qR2K(c,pool)));}
  else nc.forEach(c=>{qs.push(qK2R(c,pool));if(!NO_REVERSE.has(c))qs.push((TTS.voice&&Math.random()<.5)?qA2K(c,pool):qR2K(c,pool));else qs.push(qK2R(c,pool));});
  const mine=shuffle(d.words).slice(0,6);
  mine.forEach((w,i)=>qs.push(i%2?qM2W(w,words):qW2M(w,words)));
  if(d.kanji&&d.kanji.length){
    const kp=poolKanji(day),vp=poolKV(day);
    d.kanji.forEach(k=>{qs.push(qJ2M(k,kp));});
    shuffle(d.kanji).forEach(k=>qs.push(qM2J(k,kp)));
    const nw=shuffle(KJ_ALLWORDS.filter(w=>w.day===day));
    nw.slice(0,5).forEach((w,i)=>qs.push(i%2?qV2M(w,vp):qV2R(w,vp)));
  }
  if(d.cq){
    const pv=poolVerbs(day),today=pv.filter(v=>v.day===day);
    d.cq.forEach(kd=>{const src=today.length&&CONJ_DAY[kd]>=day?today:(today.length&&day<110?today:pv);const n=Math.max(3,Math.floor(6/d.cq.length));shuffle(src.filter(v=>day>=Math.max(v.day,CONJ_DAY[kd])&&(kd==='dict'||v[kd]))).slice(0,n).forEach(v=>qs.push(qConj(v,kd)));});
  }
  const have=new Set(qs.map(q=>q.item));
  if(day>1)reviewQs(({90:12,120:12,150:12,178:20,179:20,180:25})[day]||3,day-1,Array.from(have)).forEach(q=>qs.push(q));
  return shuffle(qs);
}

/* ================= ACCOUNT: Google sign-in (Firebase) or guest; theme ================= */
const FB_VER='10.12.2';
const AUTH={configured:false,user:null,db:null,fb:null,error:''};
const GUEST_KEY='tabi.guest',THEME_KEY='tabi.theme';
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}};

/* theme: Auto follows the device, Light = white, Dark = black */
function applyTheme(){const t=lsGet(THEME_KEY);if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');}
function themeLabel(){const t=lsGet(THEME_KEY);return t==='light'?'Light':t==='dark'?'Dark':'Auto';}
function cycleTheme(){const t=lsGet(THEME_KEY);lsSet(THEME_KEY,t==='light'?'dark':t==='dark'?null:'light');applyTheme();}
applyTheme();

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
async function authInit(){
  const cfg=window.TABI_FIREBASE;
  if(!cfg||!cfg.apiKey||!cfg.projectId)return;           /* not configured: guest-only */
  try{
    if(!window.firebase){
      const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/firebase-';
      await withTimeout(Promise.all([]).then(()=>loadScript(base+'app-compat.js')).then(()=>Promise.all([loadScript(base+'auth-compat.js'),loadScript(base+'firestore-compat.js')])),12000);
    }
    const fb=window.firebase;
    if(!fb.apps.length)fb.initializeApp(cfg);
    AUTH.fb=fb;AUTH.db=fb.firestore();AUTH.configured=true;
    AUTH.user=await withTimeout(new Promise(res=>{let off=null,done=false;off=fb.auth().onAuthStateChanged(u=>{if(done)return;done=true;try{off&&off();}catch(e){}res(u||null);});}),8000).catch(()=>null);
  }catch(e){AUTH.configured=false;AUTH.error=String(e&&e.message||e);}
}
async function authToken(){try{return AUTH.user?await AUTH.user.getIdToken():null;}catch(e){return null;}}
async function googleSignIn(){
  const fb=AUTH.fb;if(!fb)throw new Error('not configured');
  const prov=new fb.auth.GoogleAuthProvider();
  try{await fb.auth().signInWithPopup(prov);}
  catch(e){
    if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')){await fb.auth().signInWithRedirect(prov);return;}
    throw e;
  }
  lsSet(GUEST_KEY,null);
  location.reload();

/* ---- stroke order + tracing (KanjiVG stroke data) ---- */
function mountTracer(host,{chars,start,recall}){
  let cur=start||chars[0],guide=!recall,strokes=[],drawing=null,drawEl=null;
  host.innerHTML=`<div class="tracer">
    ${chars.length>1?`<div class="tabs" role="group" aria-label="Choose a kana">${chars.map(c=>`<button type="button" data-c="${c}" aria-pressed="${c===cur}">${c}</button>`).join('')}</div>`:''}
    <svg class="tsv" viewBox="0 0 109 109" role="img" aria-label="Writing area">
      <path class="grid" d="M54.5 4v101M4 54.5h101"/>
      <g class="gg"></g><g class="gn"></g><g class="ga"></g><g class="gu"></g>
    </svg>
    <div class="tools">
      <button type="button" class="btn sm" data-a="watch">${ICON.play} Watch</button>
      <button type="button" class="btn sm quiet" data-a="guide" aria-pressed="${guide}">${guide?'Guide on':'Guide off'}</button>
      <button type="button" class="btn sm quiet" data-a="undo">${ICON.undo} Undo</button>
      <button type="button" class="btn sm quiet" data-a="clear">Clear</button>
      <button type="button" class="btn sm pri" data-a="check">${ICON.check} Check</button>
    </div>
    <div class="tmsg small muted" aria-live="polite">Watch the order, then trace or write it yourself.</div></div>`;
  const svg=$('svg.tsv',host),gg=$('.gg',host),gn=$('.gn',host),ga=$('.ga',host),gu=$('.gu',host),msg=$('.tmsg',host);
  const NS='http://www.w3.org/2000/svg';
  const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);Object.keys(attrs).forEach(k=>e.setAttribute(k,attrs[k]));parent.appendChild(e);return e;};
  function load(){
    gg.innerHTML='';gn.innerHTML='';ga.innerHTML='';gu.innerHTML='';strokes=[];
    const d=STROKES[cur];if(!d)return;
    d.p.forEach(p=>mk('path',{class:'g',d:p},gg));
    d.n.forEach((n,i)=>{const t=mk('text',{class:'nm',x:n[0],y:n[1]},gn);t.textContent=i+1;});
    paintGuide();
    msg.className='tmsg small muted';msg.textContent=recall?'Write it from memory, then Check.':'Watch the order, then trace or write it yourself.';
  }
  function paintGuide(){gg.style.opacity=guide?1:0;gn.style.opacity=guide?1:0;}
  function watch(){
    ga.innerHTML='';gu.innerHTML='';strokes=[];
    const d=STROKES[cur];if(!d)return;
    gg.style.opacity=1;gn.style.opacity=1;
    let delay=0;
    d.p.forEach(p=>{
      const el=mk('path',{class:'a',d:p},ga);const L=el.getTotalLength();
      if(reduceMotion()||!el.animate){return;}
      const dur=Math.max(260,Math.min(900,L*16));
      el.style.strokeDasharray=L;el.style.strokeDashoffset=L;
      el.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay,fill:'forwards',easing:'ease-in-out'});
      delay+=dur+120;
    });
    setTimeout(paintGuide,Math.min(delay+300,6000));
  }
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?(p=>[p.x,p.y])(p.matrixTransform(m.inverse())):[0,0];};
  const dstr=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault();try{svg.setPointerCapture(e.pointerId);}catch(_){}
    ga.innerHTML='';drawing=[pt(e)];drawEl=mk('path',{class:'u',d:dstr(drawing)+'L'+dstr(drawing).slice(1)},gu);
  });
  svg.addEventListener('pointermove',e=>{if(!drawing)return;drawing.push(pt(e));drawEl.setAttribute('d',dstr(drawing));});
  const up=()=>{if(!drawing)return;if(drawing.length>2)strokes.push({pts:drawing,el:drawEl});else if(drawEl)drawEl.remove();drawing=null;drawEl=null;};
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  function check(){
    const d=STROKES[cur];
    if(!strokes.length){msg.className='tmsg small';msg.textContent='Draw something first, then Check.';return;}
    const ghost=$$('.g',gg),tp=[];
    ghost.forEach(p=>{const L=p.getTotalLength();for(let s=0;s<=L;s+=2){const q=p.getPointAtLength(s);tp.push([q.x,q.y]);}});
    const up=[];
    strokes.forEach(s=>{for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2));for(let k=0;k<=n;k++)up.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}});
    const near=(p,arr,r)=>{for(let i=0;i<arr.length;i++){if(Math.hypot(arr[i][0]-p[0],arr[i][1]-p[1])<r)return true;}return false;};
    const cover=tp.filter(p=>near(p,up,9)).length/tp.length,prec=up.filter(p=>near(p,tp,11)).length/up.length;
    const n=d.p.length,m=strokes.length;
    let t,cls='tmsg small';
    if(cover>=.75&&prec>=.75){t=`Good shape. This kana has ${n} stroke${n>1?'s':''}`+(m===n?' and you used '+m+'.':`; you used ${m}, so check the numbered order with Watch.`);cls+=' ok';}
    else if(cover<.75&&prec>=.75)t=`Part of the shape is missing. This kana has ${n} stroke${n>1?'s':''}; you drew ${m}. Try again with the guide on.`;
    else if(prec<.75&&cover>=.75)t='The shape is all there, but some marks wander off the line. Slow down and follow the guide.';
    else t='Not quite yet. Press Watch, then trace slowly over the guide.';
    msg.className=cls;msg.textContent=t;if(cls.includes('ok'))msg.style.color='var(--moss)';else msg.style.color='';
    return cover>=.75&&prec>=.75;
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!host.contains(b))return;
    if(b.dataset.c){cur=b.dataset.c;$$('.tabs button',host).forEach(x=>x.setAttribute('aria-pressed',x===b));load();return;}
    const a=b.dataset.a;
    if(a==='watch')watch();
    else if(a==='guide'){guide=!guide;b.setAttribute('aria-pressed',guide);b.textContent=guide?'Guide on':'Guide off';paintGuide();}
    else if(a==='undo'){const s=strokes.pop();if(s)s.el.remove();}
    else if(a==='clear'){gu.innerHTML='';strokes=[];ga.innerHTML='';}
    else if(a==='check')check();
  });
  load();
  return {setChar(c){cur=c;load();},watch};
}

const inputAttrs='autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"';

/* ---- quiz runner ---- */
function runQuiz(host,qs,opts){
  opts=opts||{};
  let i=0,right=0,locked=false,t0=0;const times=[],before={fresh:SES.fresh,gone:SES.gone};
  host.innerHTML=`<div class="stack"><div class="qprog" role="progressbar" aria-label="Quiz progress"><i style="width:0"></i></div><div class="qbody stack"></div></div>`;
  const bar=$('.qprog i',host),body=$('.qbody',host);
  const onKey=e=>{
    if(!host.isConnected){document.removeEventListener('keydown',onKey);return;}
    if(e.target&&e.target.tagName==='INPUT')return;
    const n=parseInt(e.key,10);
    if(n>=1&&n<=4){const b=$$('.opt',body)[n-1];if(b&&!b.disabled)b.click();}
    else if(e.key==='Enter'){const nx=$('[data-next]',body);if(nx)nx.click();}
  };
  document.addEventListener('keydown',onKey);
  function show(){
    if(i>=qs.length)return finish();
    const q=qs[i];locked=false;t0=Date.now();
    bar.style.width=(i/qs.length*100)+'%';
    const p=q.prompt;
    let html=`<div class="qprompt"><div class="q">${q.yokai?'<span class="chip bad">Yokai</span> ':''}${esc(p.q)} <span class="tiny muted">(${i+1} of ${qs.length})</span></div>`
      +(p.audioBtn?`<div>${spkBtn(q.audio||q.autoplay||'',' ')}</div>`:'')
      +(p.big?`<div class="big ${p.cls||''}">${esc(p.big)}</div>`:'')+`</div>`;
    if(q.t==='type'){
      const id=nid('tb');
      html+=`<div class="tbox"><label class="sr" for="${id}">Your answer in romaji</label><input id="${id}" type="text" ${inputAttrs} placeholder="type in romaji"><div class="conv" aria-live="polite"></div>
        <div class="row"><button type="button" class="btn pri grow" data-a="chk">Check</button><button type="button" class="btn quiet" data-a="hint">Hint</button></div></div><div class="fbslot"></div>`;
      body.innerHTML=html;
      const inp=$('input',body);attachConv(inp,$('.conv',body),q.kata);setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},50);
      const submit=()=>{if(locked)return;const val=romajiToKana(inp.value,true).kana;if(!val.trim())return;answer(cmpAns(val,q.answer),null,q.kata?toKataFold(val):val);};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
      $('[data-a=chk]',body).onclick=submit;
      $('[data-a=hint]',body).onclick=()=>{const first=[...q.answer.replace(/\s/g,'')][0];$('.fbslot',body).innerHTML=`<div class="fb">Starts with <span class="j">${esc(first)}</span> and has ${[...q.answer.replace(/\s/g,'')].length} kana.</div>`;};
    }else{
      html+=`<div class="opts ${q.col?'col':''}">${q.opts.map((o,k)=>`<button type="button" class="opt ${q.ocls||''}" data-k="${k}">${esc(o.v)}</button>`).join('')}</div><div class="fbslot"></div>`;
      body.innerHTML=html;
      $$('.opt',body).forEach(b=>b.onclick=()=>{if(locked)return;const o=q.opts[+b.dataset.k];answer(o.ok,b,null,o);});
    }
    if(q.autoplay)setTimeout(()=>speak(q.autoplay),250);
  }
  function answer(ok,btn,typed,chosen){
    if(locked)return;locked=true;
    const q=qs[i];times.push((Date.now()-t0)/1000);
    const conf=(!ok&&chosen&&chosen.k&&q.kind==='kana')?chosen.k:null;
    const res=grade(q,ok,conf);if(ok)right++;
    if(q.t==='type'){$('input',body).disabled=true;$$('.tbox .btn',body).forEach(b=>b.disabled=true);}
    else{$$('.opt',body).forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('ok');});if(btn&&!ok)btn.classList.add('bad');}
    let fb=`<div class="fb ${ok?'ok':'bad'}" role="status"><b>${ok?'Right.':'Not quite.'}</b> ${q.show||''}`;
    if(!ok&&q.hook)fb+=`<div class="small" style="margin-top:6px">${esc(q.hook)}</div>`;
    if(!ok&&q.t==='type'&&typed)fb+=`<div class="small" style="margin-top:6px">You typed <span class="j">${esc(typed)}</span></div>`;
    if(!ok)fb+=`<div class="small muted" style="margin-top:6px">${q.yokai?'This yokai stays.':'A yokai has been born for this one. Beat it on three different days to banish it.'}</div>`;
    if(res==='gone')fb+=`<div style="margin-top:6px"><span class="chip good">Yokai banished</span> You got this one right on three different days.</div>`;
    else if(ok&&q.yokai)fb+=`<div class="small muted" style="margin-top:6px">Counts toward banishing this yokai (one point per day).</div>`;
    fb+=`</div>`;
    const slot=$('.fbslot',body);slot.innerHTML=fb+(ok&&res!=='gone'?'':`<div class="lbar"><button type="button" class="btn pri" data-next>Next</button></div>`);
    if(q.audio&&!ok)speak(q.audio);
    if(ok&&res!=='gone')setTimeout(()=>{if(host.isConnected&&qs[i]===q&&locked){i++;show();}},q.t==='type'?1100:750);
    else $('[data-next]',slot).onclick=()=>{i++;show();};
    if(!ok)setTimeout(()=>{try{$('[data-next]',slot).scrollIntoView({block:'nearest'});}catch(e){}},50);
  }
  function finish(){
    document.removeEventListener('keydown',onKey);
    bar.style.width='100%';
    const fresh=SES.fresh-before.fresh,gone=SES.gone-before.gone;
    const sorted=times.slice().sort((a,b)=>a-b),med=sorted.length?sorted[Math.floor(sorted.length/2)]:0;
    if(opts.noSummary){opts.onDone&&opts.onDone({right,total:qs.length,times,med});return;}
    body.innerHTML=`<div class="card stack s" style="text-align:center"><h2>${right} of ${qs.length} right</h2>
      <div class="row" style="justify-content:center">${fresh?`<span class="chip bad">${fresh} new yokai</span>`:''}${gone?`<span class="chip good">${gone} banished</span>`:''}${opts.timed?`<span class="chip">median ${med.toFixed(1)} s</span>`:''}</div>
      <p class="muted small">${fresh?'Mistakes are the point. Each yokai is a lesson built from what you missed.':'Clean round.'}</p></div>
      <div class="lbar"><button type="button" class="btn pri" data-done>Continue</button></div>`;
    $('[data-done]',body).onclick=()=>opts.onDone&&opts.onDone({right,total:qs.length,times,med});
  }
  show();
}

/* On the website (outside Claude) the tutor goes through this site's own /api/tutor function. */
function webSampler(){

    const headers={'Content-Type':'application/json'};
    try{const tok=await authToken();if(tok)headers.Authorization='Bearer '+tok;}catch(e){}
    let r;
    try{r=await fetch('/api/tutor',{method:'POST',headers,body:JSON.stringify({messages:input}),signal:o&&o.signal});}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'};}
    let d=null;try{d=await r.json();}catch(e){}
    if(!r.ok)throw {code:(d&&d.code)||(r.status===429?'rate_limited':'error')};
    const txt=String(d&&d.text||'').replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,'').trim();
    try{return JSON.parse(txt);}catch(e){const m=txt.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0]);}catch(e2){}}throw {code:'invalid_json'};}
  }};
}
const PUNCT=/[、。？！?!]/g;
function validateTutor(o,tokens,chars){
  const bad=[];
  const chk=s=>{String(s||'').split(/\s+/).filter(Boolean).forEach(t=>{const w=t.replace(PUNCT,'');if(w&&!tokens.includes(w))bad.push(w);});
    for(const c of String(s||''))if(!chars.has(c)&&!/[\s、。？！?!]/.test(c))bad.push(c);};
  if(!o||typeof o.ja!=='string'||!o.ja.trim())return {ok:false,bad:['(empty)']};
  chk(o.ja);if(o.check&&o.check.fixed)chk(o.check.fixed);
  return {ok:bad.length===0,bad:uniq(bad)};
}

  attachConv(inp,$('.conv',form));
  const turns=[];let busy=false,ctl=null,exch=0,first=true;
  const add=html=>{const d=document.createElement('div');d.innerHTML=html;const el=d.firstElementChild;msgs.appendChild(el);try{el.scrollIntoView({block:'nearest',behavior:reduceMotion()?'auto':'smooth'});}catch(e){}return el;};
  const think=()=>add('<div class="think">Thinking…</div>');
  async function ask(extra){
    const input=[{role:'user',content:RULES}].concat(turns.slice(-10));
    ctl=new AbortController();
    return sample.json(input,{modelTier:'default',cache:false,signal:ctl.signal});
  }
  async function turn(userText){
    if(busy)return;busy=true;stopBtn.classList.remove('hide');startBtn.classList.add('hide');
    turns.push({role:'user',content:userText});
    const th=think();let obj=null,v=null,tries=0;
    try{
      while(tries<2){
        obj=await ask();v=validateTutor(obj,tokens,chars);
        if(v.ok)break;
        tries++;
        if(tries<2){turns.push({role:'assistant',content:JSON.stringify(obj)});turns.push({role:'user',content:`Rejected: your reply used things the learner has not learned: ${v.bad.join(' ')}. Say it again with the same intent, using only the allowed tokens and kana.`});}
      }
    }catch(e){
      th.remove();busy=false;stopBtn.classList.add('hide');form.classList.remove('hide');turns.pop();
      if(e&&e.code==='cancelled')return;
      add(`<div class="think">${esc(SAMPLE_MSG[e&&e.code]||'The tutor could not answer just now. Try sending again.')}</div>`);return;
    }
    th.remove();
    if(v.ok)turns.push({role:'assistant',content:JSON.stringify(obj)});
    renderTutor(obj,v);
    busy=false;stopBtn.classList.add('hide');form.classList.remove('hide');try{inp.focus({preventScroll:true});}catch(e){}
    exch++;opts.onExchange&&opts.onExchange(exch);
  }
  function renderTutor(o,v){
    const ja=String(o.ja||'').trim(),ro=esc(o.romaji||''),en=esc(o.en||'');
    let h=`<div class="msg t"><div class="row" style="flex-wrap:nowrap"><div class="ja grow">${esc(ja)}</div>${spkBtn(ja.replace(/\s+/g,''),'sm')}</div><div class="ro">${ro}</div>
      <div class="en"><button type="button" class="tap" data-en>Tap for meaning</button><span class="hide" data-enx>${en}</span></div>`;
    const c=o.check;
    if(c&&v.ok){
      if(c.verdict==='ok')h+=`<div class="pen good"><b>Good.</b> ${esc(c.why||'')}</div>`;
      else{
        h+=`<div class="pen"><div class="small muted">You wrote: ${esc(c.said||'')}</div>`+(c.fixed?`<div class="j">${esc(c.fixed)}</div><div class="small">${esc(c.fixed_en||'')}</div>`:'')+`<div class="small" style="margin-top:4px">${esc(c.why||'')}</div></div>`;
        if(c.fixed){const id='t:'+normAns(c.fixed);if(yokaiHit(id,{kind:'talk',label:c.fixed.replace(/[、。？！?!]/g,'').trim(),en:c.fixed_en||''}))SES.fresh++;gradeItem(id,false);touch();h+=`<div class="tiny muted" style="margin-top:6px">A yokai followed you home. It will show up in a later round.</div>`;}
      }
    }
    if(!v.ok)h+=`<div class="pen"><b>Unverified.</b> This reply used words outside your learned list (${esc(v.bad.join(' '))}). Treat it with care and press Report.</div>`;
    h+=`<div style="margin-top:6px"><button type="button" class="tap tiny" data-rep>Report this reply</button></div></div>`;
    const el=add(h);
    $('[data-en]',el).onclick=e=>{e.target.classList.add('hide');$('[data-enx]',el).classList.remove('hide');};
    $('[data-rep]',el).onclick=e=>{S.reports.push({t:Date.now(),ja,en:o.en||'',check:o.check||null,day:upto,valid:v.ok});S.reports=S.reports.slice(-40);touch();e.target.textContent='Reported. Thank you.';e.target.disabled=true;};
  }
  startBtn.onclick=()=>{startBtn.disabled=true;turn('Start the scene with your first line.');};
  stopBtn.onclick=()=>{if(ctl)ctl.abort();};
  form.addEventListener('submit',e=>{
    e.preventDefault();if(busy)return;const t=inp.value.trim();if(!t)return;
    const kana=romajiToKana(t,true).kana;
    const clean=/[\u3040-\u309f]/.test(kana)&&!/[a-z]/i.test(kana);
    add(`<div class="msg u"><div>${esc(t)}</div>${kana!==t&&clean?`<div class="ja" style="font-size:22px">${esc(kana)}</div>`:''}</div>`);
    inp.value='';$('.conv',form).innerHTML='';
    turn(`Learner wrote: ${JSON.stringify(t)}`+(clean?` (as kana: ${JSON.stringify(kana)})`:' (probably English or unconvertible romaji)'));
  });
  return {};
}

/* ================= DAY 0: the briefing ================= */
const FLIGHT=[
 {t:'Welcome aboard',h:()=>`<p class="story">You are about to learn Japanese in 180 days. Not by cramming. By showing up for 15 minutes, every single day.</p>
   <p>Each day is one scene in a trip from Tokyo to Osaka. Mika, a friend who lives in Tokyo, keeps sending you notes you need to read.</p>
   <p class="muted">This briefing takes about 8 minutes. It explains how the language works, so nothing on Day 1 is a surprise.</p>`},
 {t:'Three alphabets in one sentence',h:()=>`<div class="script-demo" lang="ja"><span class="kj">私</span><span class="hi">は</span><span class="ka">コーヒー</span><span class="hi">を</span><span class="kj">飲</span><span class="hi">みます</span></div>
   <div class="legend"><span><i style="background:var(--seal)"></i>Kanji</span><span><i style="background:var(--indigo)"></i>Hiragana</span><span><i style="background:var(--moss)"></i>Katakana</span></div>
   <p><i>watashi wa kōhī o nomimasu</i>: “I drink coffee.”</p>
   <p><b style="color:var(--seal)">Kanji</b> are characters borrowed from Chinese. Each carries a meaning (私 “I”, 飲 “drink”). <b style="color:var(--indigo)">Hiragana</b> are sound letters used for grammar and native words. <b style="color:var(--moss)">Katakana</b> are the same sounds in a second shape, mostly for foreign words like コーヒー (coffee).</p>
   <p class="muted">Your order in Tabi: hiragana first (Days 1 to 10), then katakana, then kanji, a few at a time.</p>`},
 {t:'What is kana?',h:()=>`<p><b>Kana</b> is the name for hiragana and katakana together. The key idea: <b>each symbol is a whole syllable</b>, like “ka” or “mi”, not a single letter like “k”.</p>
   <p>There are only 46 basic sounds, laid out in a table of five vowels across and ten consonant rows down. Tap any cell to hear it. You will own this whole table by Day 9.</p>
   <div class="gojuon" style="max-width:480px">${chartHTML(['a','k','s','t','n','h','m','y','r','w'],99)}</div><div class="tiny muted" id="ttsnote">${esc(ttsNote())}</div>`},
 {t:'Five vowels carry everything',h:()=>`<div class="row" style="justify-content:center;gap:10px">${['あ','い','う','え','お'].map(c=>`<button type="button" class="cell" style="width:58px" data-kana="${c}"><b>${c}</b><span>${K[c].r}</span></button>`).join('')}</div>${DAYS[1].note.html}`},
 {t:'The verb goes last',h:()=>`<p>English puts the verb in the middle. Japanese puts it at the end.</p>
   <div class="stack s"><div class="small muted">English</div><div class="blocks"><div class="blk s"><span class="j" style="font-family:var(--f-ui)">I</span></div><div class="blk v"><span class="j" style="font-family:var(--f-ui)">eat</span></div><div class="blk o"><span class="j" style="font-family:var(--f-ui)">an apple</span></div></div>
   <div class="small muted" style="margin-top:6px">Japanese</div><div class="blocks" lang="ja"><div class="blk s"><span class="j">わたし は</span><span class="r">watashi wa · I (as for me)</span></div><div class="blk o"><span class="j">りんご を</span><span class="r">ringo o · apple (what I act on)</span></div><div class="blk v"><span class="j">たべます</span><span class="r">tabemasu · eat</span></div></div></div>
   <p>The verb always closes the sentence. If you speak Hindi or Telugu, you already think this way.</p><p class="muted small">Do not memorise these words yet. Just see the shape of the sentence.</p>`},
 {t:'Little tags after words',h:()=>`<p>Small words called <b>particles</b> sit after a noun and tell you its job in the sentence. Like Hindi का/को/में or Telugu -ki/-lo, they come after the word.</p>
   <div class="ptable" lang="ja"><div><span class="j">は</span><span><b>wa</b>: the topic, “as for…”</span></div><div><span class="j">が</span><span><b>ga</b>: who or what does it</span></div><div><span class="j">を</span><span><b>o</b>: what you act on</span></div><div><span class="j">の</span><span><b>no</b>: “of” or “’s”</span></div><div><span class="j">に</span><span><b>ni</b>: to, at, in</span></div><div><span class="j">で</span><span><b>de</b>: where it happens, or by what means</span></div></div>
   <p class="muted small">は and を are read “wa” and “o” when used as tags, not “ha” and “wo”. You will meet the real sentences on Day 10.</p>`},
 {t:'What you get to ignore',h:()=>`<div class="stack s"><p><b>No “a” or “the.”</b> Japanese has no articles.</p><p><b>No plural forms.</b> The same word means “book” or “books”.</p><p><b>No grammatical gender.</b></p><p><b>Verbs do not change for I, you or he.</b> The same verb form works for everyone.</p></div>
   <p class="muted">Japanese does have politeness levels. Tabi starts with the polite ます/です style, which is safe with anyone.</p>`},
 {t:'Rhythm, not stress',h:()=>`<p>Every kana takes one even beat. Say <i>ka-ra-o-ke</i> with four equal beats. English stresses one syllable (“comPUter”); Japanese does not.</p>
   <p>Long vowels take two beats, and the length changes the word:</p>
   <div class="ptable" lang="ja"><div><span class="j" style="font-size:20px">おばさん</span><span class="row">obasan: aunt ${spkBtn('おばさん','sm')}</span></div><div><span class="j" style="font-size:20px">おばあさん</span><span class="row">obaasan: grandmother ${spkBtn('おばあさん','sm')}</span></div></div>
   <p class="muted small">${esc(ttsNote())||'Device voices are decent but not perfect. When in doubt, trust the romaji and repeat a lot.'}</p>`},
 {t:'How your 15 minutes work',h:()=>`<div class="stack s"><p><b>Yokai round (3 min).</b> Every mistake becomes a yokai, a small spirit. Answer its question correctly on three different days and it is banished. Your yokai also decide what shows up in later lessons.</p>
   <p><b>Scene (6 min).</b> The day's story, new kana with memory hooks and stroke order, a few words, and a quiz.</p><p><b>Talk (4 min).</b> A tutor that only uses words you have already learned.</p><p><b>Wrap (2 min).</b> Type what you learned, then a cliffhanger for tomorrow.</p></div>
   <div class="note">Only the 15 minutes count for the streak. The bonus hour is extra and never required. On a rough day, light a 5-minute lantern: the streak stays alive and Tabi records it as half a day.</div>`}
];

const GOAL_SEC=15*60;
const lessonBar=(back,label,disabled)=>`<div class="lbar">${back?'<button type="button" class="btn quiet" data-a="back">Back</button>':''}<button type="button" class="btn pri" data-a="next" ${disabled?'disabled':''}>${label||'Next'}</button></div>`;
function pager(host,pages,done){
  let i=0;
  const show=()=>{
    host.innerHTML='';const w=document.createElement('div');w.className='stack';host.appendChild(w);
    const ctl={i,n:pages.length,next(){if(i<pages.length-1){i++;show();try{window.scrollTo(0,0);}catch(e){}}else done();},back(){if(i>0){i--;show();}}};
    pages[i](w,ctl);
    w.addEventListener('click',e=>{const b=e.target.closest('[data-a=next],[data-a=back]');if(!b||!w.contains(b))return;if(b.dataset.a==='next')ctl.next();else ctl.back();});
  };
  show();
}
function seenUpTo(){
  let u=doneUpTo();
  Object.keys(S.items).forEach(id=>{if(!(S.items[id].seen>0))return;const v=id.slice(2);const d=id[0]==='k'&&K[v]?K[v].day:id[0]==='w'&&WORD[v]?WORD[v].day:id[0]==='j'&&KJ[v]?KJ[v].day:id[0]==='v'&&KVW[id]?KVW[id].day:id[0]==='x'&&VERB[v.split('|')[0]]?Math.max(VERB[v.split('|')[0]].day,CONJ_DAY[v.split('|')[1]]):0;if(d>u)u=d;});
  Object.values(S.yokai).forEach(y=>{if(y.gone)return;const d=y.kind==='kana'&&K[y.label]?K[y.label].day:y.kind==='word'&&WORD[y.label]?WORD[y.label].day:y.kind==='kanji'&&KJ[y.label]?KJ[y.label].day:y.kind==='kword'&&KVW[y.id]?KVW[y.id].day:y.kind==='conj'&&VERB[y.label]?Math.max(VERB[y.label].day,CONJ_DAY[y.id.split('|')[1]]):0;if(d>u)u=d;});
  return u;
}

  const qs=yokaiQs(5,seenUpTo());

function stepScene(host,L,next){
  const day=L.day;let pages=[];
  if(L.review)pages=[pageReviewIntro(),pageQuiz(()=>reviewQs(14,seenUpTo()))];
  else{
    const d=DAYS[day];pages.push(pageStory(day));
    if(day===1&&d.note)pages.push(pageNote(day));
    if(VOICE_BY_DAY[day])VOICE_BY_DAY[day].forEach(vp=>pages.push(pageVoice(vp)));
    else d.chars.forEach((c,i)=>pages.push(pageKana(c,i,d.chars.length)));
    d.kanji.forEach((k,i)=>pages.push(pageKanji(k,i,d.kanji.length)));
    if(d.words.length)pages.push(pageWords(day));
    if((day>=107&&day<=112)||day===136||day===146||day===170||day===171||day===173)pages.push(pageVerbs(day));
    if(day!==1&&d.note)pages.push(pageNote(day));
    pages.push(pageQuiz(()=>lessonQuiz(day)));
  }
  pager(host,pages,next);
}
function stepTalk(host,L,next){
  const up=L.review?seenUpTo():L.day,d=DAYS[Math.min(L.day,LAST_DAY)];
  host.innerHTML=`<div class="stack"><div><h2>Talk</h2><p class="muted small">About four minutes. ${L.review?'Free conversation with Mika.':esc(d.persona)}</p></div><div id="chat"></div>
    <div class="lbar static"><button type="button" class="btn quiet" data-a="skip" id="skip">Skip the tutor</button></div></div>`;
  const skip=$('#skip',host);skip.onclick=next;
  const fallback=()=>`<div class="card stack s"><h3>Say it out loud instead</h3><p class="small muted">The tutor is not available in this view. Say each word twice, then continue.</p><div class="words" lang="ja">${poolWords(up).slice(-8).map(x=>`<div class="word"><span class="j">${x.j}</span><span class="r">${esc(x.r)}</span><span class="m">${esc(x.en)}</span>${spkBtn(x.j,'sm')}</div>`).join('')}</div></div>`;
  mountChat($('#chat',host),{upto:up,persona:L.review?"Mika, the learner's friend in Tokyo, chatting casually.":d.persona,stage:L.review?'The learner is reviewing. Keep turns very short.':d.stage,fallback,onFallback:()=>{skip.textContent='Continue';skip.classList.remove('quiet');skip.classList.add('pri');},
    onExchange:n=>{if(n>=3){skip.textContent='Finish talking';skip.classList.remove('quiet');skip.classList.add('pri');}}});
}
function stepWrap(host,L,next){
  const pool=L.review?poolWords(seenUpTo()):DAYS[L.day].words;
  const qs=shuffle(pool).slice(0,3).map(qType);
  host.innerHTML=`<div class="stack"><div><h2>Wrap</h2><p class="muted small">Type what you learned. Romaji turns into kana as you type.</p></div><div id="wq"></div></div>`;
  runQuiz($('#wq',host),qs,{noSummary:true,onDone:next});
}

/* ---- the lesson ---- */
function completeDay(L){
  const t=todayKey(),lg=S.log[t]||(S.log[t]={core:false,lantern:false,coreSec:0,bonusSec:0});
  if(!L.bonus){lg.core=true;lg.dayN=L.day;}
  if(!L.review)S.done[L.day]={at:t,sec:Math.round(SES.sec),answers:SES.answers,correct:SES.correct};
  touch();commit();
}
function doneScreen(m,L){
  const st=streak(),d=DAYS[L.day],nd=nextDay();
  const tom=L.review?'Osaka arrives in the next update. Until then, a short review each day keeps your streak going.':d.teaser;
  const acc=SES.answers?Math.round(SES.correct/SES.answers*100):0;
  m.innerHTML=`<div class="donewrap">
   <div class="slam">${sealSVG(String(st.cur),'STREAK',160)}</div>
   <h1>${L.bonus?'Bonus scene complete':L.review?'Review complete':'Day '+L.day+' complete'}</h1>
   <p class="muted">${L.bonus?'Your streak was already safe today. This is extra.':'Today is stamped. '+(st.cur>1?'That is '+st.cur+' days in a row.':'The streak begins.')}</p>
   <div class="row" style="justify-content:center"><span class="chip">${Math.max(1,Math.round(SES.sec/60))} min</span><span class="chip">${acc}% right</span>${SES.fresh?`<span class="chip bad">${SES.fresh} new yokai</span>`:''}${SES.gone?`<span class="chip good">${SES.gone} banished</span>`:''}</div>
   ${!L.review&&L.day===10?`<div class="card stack s" style="text-align:left"><h3>Hiragana complete</h3><p class="small">You have met every basic hiragana and its voiced forms. Tomorrow: katakana.</p></div>`:''}
   ${!L.review&&L.day===20?`<div class="card stack s" style="text-align:left"><h3>Katakana complete</h3><p class="small">You can now read both kana sets. Try the katakana speed gate from the Today screen.</p></div>`:''}
   ${!L.review&&L.day===30?`<div class="card stack s" style="text-align:left"><h3>Tokyo complete</h3><p class="small">30 days, both kana, greetings, introductions, numbers, time, directions and ordering. Tomorrow: Kamakura.</p></div>`:''}
   ${!L.review&&L.day===60?`<div class="card stack s" style="text-align:left"><h3>Kamakura complete</h3><p class="small">60 days: you can describe things, go places, ask for things, give your plans and say thanks. Next: Hakone, where you meet your first kanji.</p></div>`:''}
   ${!L.review&&L.day===120?`<div class="card stack s" style="text-align:left"><h3>Nagoya complete</h3><p class="small">120 days: 90 kanji, the plain forms of verbs, and sentences for ability, experience, plans and reasons. Next: Kyoto, where the N4 patterns begin.</p></div>`:''}
   ${!L.review&&L.day===150?`<div class="card stack s" style="text-align:left"><h3>Kyoto complete</h3><p class="small">150 days: 121 kanji, the potential and volitional forms, and the N4 patterns for advice, obligation, guesses, conditions and requests. Next: Osaka, the last region, with a mock N4.</p></div>`:''}
   ${!L.review&&L.day===180?`<div class="card stack s" style="text-align:left"><h3>Journey complete</h3><p class="small">180 days across six regions: both kana, ${WORDS.length} words, ${KANJI.length} kanji, and the verb forms and patterns of the N4 level. From tomorrow each day is a 15-minute review, so your streak and your yokai den carry on. For an honest measure, try a published JLPT N4 practice paper.</p></div>`:''}
   ${!L.review&&L.day===90?`<div class="card stack s" style="text-align:left"><h3>Hakone complete</h3><p class="small">90 days: 57 first kanji, longer sentences, asking, refusing, warning and giving reasons. Next: Nagoya, where you learn plain verb forms.</p></div>`:''}
   <div class="note" style="text-align:left;max-width:520px"><b>Next scene:</b> ${esc(tom)}</div>
   <div class="stack s" style="width:100%;max-width:420px"><button type="button" class="btn pri block" data-go="home">Back to today</button>
   ${!L.review&&nd<=LAST_DAY?`<button type="button" class="btn block" data-go="lesson" data-p='{"day":${nd},"bonus":true}'>Ride ahead: Day ${nd} (bonus)</button>`:''}</div></div>`;
}
VIEWS.lesson=function(m,p){
  let day=p.day,review=!!p.review;if(day>LAST_DAY)review=true;
  const L={day,review,bonus:!!p.bonus||!!(logToday()&&logToday().core)};
  resetSES();ACT.mode=L.bonus?'bonus':'core';ACT.last=Date.now();
  const steps=[['Yokai',stepYokai],[review?'Review':'Scene',stepScene],['Talk',stepTalk],['Wrap',stepWrap]];
  m.innerHTML=`<div class="stack"><div class="lhead"><button type="button" class="x" id="lx" aria-label="Leave lesson">${ICON.x}</button><div class="dots" id="ldots"></div><span class="timer num" id="ltime">0:00 / 15:00</span></div><div id="lask"></div><div id="lbody"></div></div>`;
  const timer=setInterval(()=>{const t=$('#ltime');if(t)t.textContent=fmtClock(SES.sec)+' / 15:00';},1000);CLEAN=()=>clearInterval(timer);
  $('#lx').onclick=()=>{$('#lask').innerHTML=`<div class="fb bad"><b>Leave this lesson?</b> Your answers so far are kept, but the day will not be marked done.<div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="lkeep">Keep going</button><button type="button" class="btn sm quiet" id="lleave">Leave</button></div></div>`;
    $('#lkeep').onclick=()=>{$('#lask').innerHTML='';};$('#lleave').onclick=()=>go('home');};
  const run=i=>{
    if(i>=steps.length){clearInterval(timer);completeDay(L);doneScreen(m,L);try{window.scrollTo(0,0);}catch(e){}return;}
    $('#ldots').innerHTML=steps.map((s,k)=>`<i class="${k<i?'on':k===i?'cur':''}" title="${s[0]}"></i>`).join('');
    const host=$('#lbody');host.innerHTML='';try{window.scrollTo(0,0);}catch(e){}
    steps[i][1](host,L,()=>run(i+1));
  };
  run(0);
};

/* ---- bonus quiz modes + lantern ---- */
function speedQs(up,sc){
  const pool=poolChars(up).filter(c=>K[c].script===sc),qs=[];let bag=[];
  while(qs.length<20){if(!bag.length)bag=shuffle(pool);const c=bag.pop();qs.push((Math.random()<.6||NO_REVERSE.has(c))?qK2R(c,pool):qR2K(c,pool));}
  return qs;
}
VIEWS.quiz=function(m,p){
  const mode=p.mode,up=seenUpTo();
  ACT.mode=mode==='lantern'?'core':'bonus';ACT.last=Date.now();resetSES();
  let qs=[],title='',sub='';
  if(mode==='due'){title='Review what is due';qs=reviewQs(12,up);}
  else if(mode==='speed'){title='Speed gate';sub='20 kana, answer fast. To pass: 18 or more right with a median under 3 seconds, once all 46 basic kana are learned.';qs=up>=1?speedQs(up,'h'):[];}
  else if(mode==='speedk'){title='Katakana speed gate';sub='20 kana, answer fast. To pass: 18 or more right with a median under 3 seconds, once all 71 katakana are learned.';qs=up>=11?speedQs(up,'k'):[];}
  else if(mode==='yokai1'){title='Face the yokai';if(S.yokai[p.id])for(let i=0;i<3;i++){const q=qFromItem(p.id,up);if(q){q.yokai=true;qs.push(q);}}}
  else if(mode==='lantern'){title='Light a lantern';sub='Five minutes, six questions. Your streak stays alive.';const yq=yokaiQs(3,up);qs=yq.concat(reviewQs(6-yq.length,up,yq.map(q=>q.item)));}
  m.innerHTML=`<div class="stack"><div class="lhead"><button type="button" class="x" data-go="home" aria-label="Back">${ICON.x}</button><h2 class="grow">${title}</h2></div>${sub?`<p class="muted small">${sub}</p>`:''}<div id="qh"></div></div>`;
  const host=$('#qh',m);
  if(!qs.length){host.innerHTML=`<div class="card"><p>Nothing to ask yet. Finish a lesson first.</p></div>`;return;}
  runQuiz(host,qs,{timed:mode==='speed'||mode==='speedk',onDone:r=>{
    if(mode==='speed'||mode==='speedk'){
      const sk=mode==='speedk'?'speedK':'speed',sc=mode==='speedk'?'k':'h',full=poolChars(up).filter(c=>K[c].script===sc).length>=(mode==='speedk'?71:46),pass=full&&r.right>=18&&r.med<=3,prev=S[sk];
      if(!prev||r.right>prev.right||(r.right===prev.right&&r.med<prev.med)||(pass&&!prev.pass))S[sk]={right:r.right,med:r.med,date:todayKey(),pass:pass||!!(prev&&prev.pass)};
      touch();
      host.innerHTML=`<div class="card stack s" style="text-align:center"><h2>${pass?'Gate passed':full?'Not yet':'Practice run'}</h2><p>${r.right} of 20 right, median ${r.med.toFixed(1)} s.</p><p class="muted small">${pass?'You read kana fast enough for the next region.':full?'You need 18 or more right and a median under 3 seconds. Check the Den, then try again.':'The official gate needs every kana of this script. Keep going through the days.'}</p><div class="row" style="justify-content:center"><button type="button" class="btn pri" data-go="home">Back to today</button><button type="button" class="btn" data-go="quiz" data-p='{"mode":"${mode}"}'>Again</button></div></div>`;
    }else if(mode==='lantern'){
      const t=todayKey(),lg=S.log[t]||(S.log[t]={core:false,lantern:false,coreSec:0,bonusSec:0});if(!lg.core)lg.lantern=true;touch();commit();
      const st=streak();
      host.innerHTML=`<div class="donewrap"><div class="slam">${sealSVG(String(st.cur),'LANTERN',150).replace('<svg ','<svg style="color:var(--amber)" ')}</div><h1>Lantern lit</h1><p class="muted">Streak kept at ${st.cur} day${st.cur===1?'':'s'}. It counts as half a day. Come back tomorrow for the full 15 minutes.</p><div class="stack s" style="width:100%;max-width:420px"><button type="button" class="btn pri block" data-go="home">Back to today</button></div></div>`;
    }else go(mode==='yokai1'?'den':'home');
  }});
};

/* ---- trace studio (write from memory, then check) ---- */
VIEWS.trace=function(m){
  ACT.mode='bonus';ACT.last=Date.now();
  const chars=poolChars(seenUpTo()).filter(c=>!NO_REVERSE.has(c));
  if(!chars.length){m.innerHTML=`<div class="card"><p>Finish Day 1 first.</p><button type="button" class="btn pri" data-go="home">Back</button></div>`;return;}
  let cur=pick(chars);
  m.innerHTML=`<div class="stack"><div class="lhead"><button type="button" class="x" data-go="home" aria-label="Back">${ICON.x}</button><h2 class="grow">Trace studio</h2></div>
   <div class="card stack s" style="text-align:center"><div class="small muted">Write the kana for</div><div class="romaji" id="tp" style="font-size:44px"></div></div><div id="tr"></div>
   <div class="lbar"><button type="button" class="btn pri" id="nx">Next kana</button></div></div>`;
  const t=mountTracer($('#tr',m),{chars:[cur],start:cur,recall:true});
  const paint=()=>{$('#tp').textContent=K[cur].r+(K[cur].script==='k'?' (katakana)':' (hiragana)');};paint();
  $('#nx').onclick=()=>{let n;do{n=pick(chars);}while(n===cur&&chars.length>1);cur=n;t.setChar(cur);paint();};
};

/* ================= BOOT ================= */
(async function boot(){
  $('#main').innerHTML='<p class="muted" style="padding-top:40px;text-align:center">Opening your journey…</p>';
  try{await authInit();if(AUTH.configured&&!AUTH.user&&!lsGet(GUEST_KEY))await authGate();}catch(e){}
  try{await initStorage();}catch(e){S=S||newState();}
  const n=FROM_HASH[location.hash.slice(1)];
  VIEW={name:n&&n!=='flight'?n:'home',params:{}};
  render();
})();
