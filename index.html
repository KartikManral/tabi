<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A4A8D'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E6%97%85%3C/text%3E%3C/svg%3E"><script src="firebase-config.js"></script><title>Tabi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>html{-webkit-tap-highlight-color:transparent}
/* Layout: phone-first single column with bottom tabs; at 900px+ a left rail and a centred reading column.
   The one loud element is the red hanko seal (streak, day complete, region stamps). Everything else stays quiet indigo ink on cool washi paper. */
:root{
  --paper:#FFFFFF; --card:#F5F6F8; --card2:#ECEEF2; --ink:#14192B; --ink2:#555C70; --line:#DDE0E7;
  --indigo:#2A4A8D; --on-indigo:#FFFFFF; --seal:#BF3A2B; --on-seal:#FFFFFF; --moss:#2F6B46; --amber:#8A5E14;
  --ghost:#C5CAD6; --good-bg:#E3F1E5; --bad-bg:#FBE4E0; --warn-bg:#F7EDD6; --shadow:0 1px 0 rgba(20,25,43,.05);
  --r:14px;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --card:#121316; --card2:#1B1D22; --ink:#F1F2F5; --ink2:#A4A9B5; --line:#2B2E36;
    --indigo:#8FAEF0; --on-indigo:#000000; --seal:#E2564A; --on-seal:#FFFFFF; --moss:#73C08E; --amber:#E2A44E;
    --ghost:#3A3F4C; --good-bg:#10291A; --bad-bg:#33181B; --warn-bg:#30270F; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --card:#121316; --card2:#1B1D22; --ink:#F1F2F5; --ink2:#A4A9B5; --line:#2B2E36;
  --indigo:#8FAEF0; --on-indigo:#000000; --seal:#E2564A; --on-seal:#FFFFFF; --moss:#73C08E; --amber:#E2A44E;
  --ghost:#3A3F4C; --good-bg:#10291A; --bad-bg:#33181B; --warn-bg:#30270F; --shadow:none; color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:14px} .tiny{font-size:12.5px}
.jp{font-family:var(--f-display);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* shell */
.app{max-width:1100px;margin:0 auto;display:block}
main{min-width:0;padding-block:18px 108px;max-width:760px;margin:0 auto}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.rail .logo{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;border:0;background:none;
  color:var(--ink2);font-size:12px;font-weight:500;cursor:pointer;border-radius:10px;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--indigo);font-weight:700}
.tab .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--seal);color:var(--on-seal);font-size:11px;line-height:16px;text-align:center;font-weight:700;padding:0 4px}
body.focus .rail{display:none}
body.focus main{padding-bottom:24px}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:200px minmax(0,760px);gap:48px;justify-content:center}
  .rail{position:sticky;top:0;align-self:start;height:100vh;flex-direction:column;justify-content:flex-start;gap:6px;border:0;background:none;padding:28px 0}
  .rail .logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:46px;font-size:16px}
  .tab .dot{position:static;margin-left:auto}
  main{padding-block:30px 60px;margin:0;width:100%}
  .top{display:none}
}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{background:transparent}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.s{gap:10px} .stack.l{gap:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;color:var(--ink2)}
.chip.good{background:var(--good-bg);border-color:transparent;color:var(--moss)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--amber)}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--seal)}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--indigo);border-radius:4px;transition:width .4s}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.note{border-left:3px solid var(--indigo);padding:6px 0 6px 14px;color:var(--ink)}
.note.warn{border-color:var(--amber)}
hr.dash{border:0;border-top:1.5px dashed var(--line);margin:0}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:.02em}
.brand span{font-family:var(--f-display);font-size:15px;color:var(--ink2)}
.seal{display:block;color:var(--seal)}
.seal text{font-family:var(--f-display);font-weight:800;fill:currentColor}
.hero{display:grid;gap:14px}
.hero .day{font-family:var(--f-display);font-size:15px;color:var(--ink2);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps div{background:var(--card2);border-radius:10px;padding:8px 8px 9px;font-size:12.5px;line-height:1.25;color:var(--ink2)}
.steps b{display:block;color:var(--ink);font-size:13.5px}
.week{display:flex;gap:8px}
.week i{flex:1;height:38px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--ink2);background:var(--card2)}
.week i.core{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.week i.lan{background:var(--warn-bg);border-color:var(--amber);color:var(--amber)}
.week i.today{outline:2px solid var(--seal);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;min-height:76px}
.mode b{font-size:16px} .mode span{font-size:13.5px;color:var(--ink2)}
.mode:hover{border-color:var(--indigo)}
.mode[disabled]{opacity:.5;cursor:not-allowed}

/* lesson shell */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lhead .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.lhead .x svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--indigo)} .dots i.cur{background:var(--seal)}
.timer{font-size:13px;font-weight:700;color:var(--ink2);min-width:84px;text-align:right}
.lbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:14px 0 max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 28%);margin-top:6px}
.lbar .btn{flex:1}
.lbar.static{position:static;background:none}
.kbig{font-family:var(--f-display);font-weight:600;font-size:clamp(92px,30vw,150px);line-height:1;text-align:center}
.romaji{font-family:var(--f-ui);font-weight:700;font-size:28px;text-align:center}
.vtab{display:grid;gap:6px;margin:8px 0}.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:15px;overflow-wrap:anywhere}.vrow.vh{background:none;font-size:13px;color:var(--muted);padding-bottom:0}
.hook{background:var(--card2);border-radius:12px;padding:12px 14px;font-size:16px}
.story{font-size:18px;line-height:1.6}
.kchips{display:flex;gap:8px;flex-wrap:wrap}
.kchip{font-family:var(--f-display);font-weight:600;font-size:26px;min-width:48px;height:48px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;padding:0 6px}
.spk{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.spk svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk.sm{width:40px;height:40px}
.words{display:grid;gap:8px}
.word{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.word .j{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2}
.word .r{color:var(--ink2);font-size:14px}
.word .m{grid-column:1;font-size:15px}
.word .spk{grid-row:1/4;grid-column:2}

/* quiz */
.qprog{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--indigo);transition:width .3s}
.qprompt{text-align:center;display:grid;gap:8px;justify-items:center;min-height:150px;align-content:center}
.qprompt .q{font-size:15px;color:var(--ink2)}
.qprompt .big{font-family:var(--f-display);font-weight:600;font-size:clamp(70px,22vw,104px);line-height:1}
.qprompt .big.t{font-family:var(--f-ui);font-weight:700;font-size:clamp(40px,12vw,56px)}
.qprompt .big.w{font-size:clamp(44px,13vw,64px)}
.qprompt .big.m{font-family:var(--f-ui);font-weight:700;font-size:clamp(26px,7vw,34px);line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.col{grid-template-columns:1fr}
.opt{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;font-weight:700;padding:8px 10px;display:grid;place-items:center;text-align:center}
.opt.k{font-family:var(--f-display);font-size:38px;font-weight:600}
.opt.w{font-family:var(--f-display);font-size:26px;font-weight:600}
.opt.m{font-weight:500;font-size:17px}
.opt:hover:not([disabled]){border-color:var(--indigo)}
.opt.ok{background:var(--good-bg);border-color:var(--moss);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--seal)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--good-bg)} .fb.bad{background:var(--bad-bg)}
.fb .j{font-family:var(--f-display);font-weight:600;font-size:22px}
.tbox{display:grid;gap:8px}
.tbox input{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 20px var(--f-ui);padding:0 14px;width:100%}
.tbox input:focus{outline:3px solid var(--indigo);outline-offset:1px;border-color:var(--indigo)}
.conv{min-height:44px;font-family:var(--f-display);font-weight:600;font-size:30px;text-align:center}
.conv small{font-family:var(--f-ui);font-size:20px;color:var(--ink2);font-weight:500}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:600;font-size:22px;cursor:pointer}

/* tracer */
.tracer{display:grid;gap:10px;justify-items:center}
.tracer svg.tsv{width:min(100%,300px);aspect-ratio:1;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);touch-action:none;display:block}
.tsv .g{stroke:var(--ghost);fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.tsv .a{stroke:var(--ink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tsv .u{stroke:var(--indigo);fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.tsv .nm{font:700 7px var(--f-ui);fill:var(--seal)}
.tsv .grid{stroke:var(--line);stroke-width:.5;stroke-dasharray:2 2}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:420px}
.tools .btn{flex:1 1 28%;padding:0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{min-width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:600;font-size:24px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--indigo);background:var(--card2);outline:2px solid var(--indigo)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:92%;border-radius:14px;padding:10px 14px}
.msg.t{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.u{align-self:flex-end;background:var(--indigo);color:var(--on-indigo)}
.msg .ja{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.35}
.msg .ro{font-size:14.5px;opacity:.85}
.msg .en{font-size:14.5px;opacity:.9;margin-top:4px}
.msg .tap{background:none;border:0;padding:0;font-size:14px;color:var(--indigo);text-decoration:underline;cursor:pointer}
.pen{background:var(--bad-bg);border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14.5px}
.pen .j{font-family:var(--f-display);font-weight:600;font-size:20px}
.pen.good{background:var(--good-bg)}
.think{font-size:14px;color:var(--ink2)}

/* map */
.region{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;position:relative;padding-bottom:22px}
.region::before{content:"";position:absolute;left:37px;top:76px;bottom:-2px;width:0;border-left:2.5px dashed var(--line)}
.region:last-child::before{display:none}
.region .stampcol{display:grid;justify-items:center;align-content:start}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;margin-top:12px}
.dcell{height:48px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink2);background:var(--card2);position:relative}
.dcell.done{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.dcell.next{border-color:var(--seal);color:var(--seal);outline:2px solid var(--seal);outline-offset:1px;background:var(--card)}
.dcell.live{border-color:var(--indigo);color:var(--ink);background:var(--card)}
.dcell.soon{opacity:.55}

/* den */
.yk{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}
.yk .face{width:76px;height:76px}
.pips{display:flex;gap:5px}
.pips i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2)}
.pips i.on{background:var(--moss);border-color:var(--moss)}

/* chart */
.gojuon{display:grid;gap:6px}
.grow5{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.grow5 .rl{font-size:12px;color:var(--ink2);text-align:center}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;align-content:center;cursor:pointer;padding:0;line-height:1.05}
.cell b{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,6.4vw,34px)}
.cell span{font-size:11.5px;color:var(--ink2)}
.cell.off{opacity:.4}
.cell.empty{border:0;background:none;cursor:default}
.cell.sel{outline:2px solid var(--indigo)}

/* flight */
.fcard{min-height:300px;display:grid;gap:14px;align-content:start}
.script-demo{font-family:var(--f-display);font-size:clamp(28px,8vw,42px);font-weight:600;line-height:1.5}
.script-demo .kj{color:var(--seal)} .script-demo .hi{color:var(--indigo)} .script-demo .ka{color:var(--moss)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.blocks{display:flex;gap:8px;flex-wrap:wrap}
.blk{border-radius:10px;padding:8px 12px;background:var(--card2);border:1px solid var(--line);display:grid;gap:0}
.blk .j{font-family:var(--f-display);font-weight:600;font-size:22px}
.blk .r{font-size:12.5px;color:var(--ink2)}
.blk.s{border-color:var(--indigo)} .blk.o{border-color:var(--amber)} .blk.v{border-color:var(--seal)}
.ptable{display:grid;gap:8px}
.ptable div{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--card2);border-radius:10px;padding:8px 12px}
.ptable .j{font-family:var(--f-display);font-weight:800;font-size:30px;text-align:center}

/* done */
.donewrap{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:8px}
.slam{animation:slam .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{0%{transform:scale(2.4) rotate(-16deg);opacity:0}55%{transform:scale(.92) rotate(-7deg);opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.slam{animation:none;transform:rotate(-7deg)}.bar>i,.qprog i{transition:none}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(8,12,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);width:min(580px,100%);max-height:94%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}

11:{title:'Signs at the Crossing',place:'Shibuya Crossing',
 story:"Mika walks you to Shibuya Crossing. Half the signs look like hiragana that someone sharpened with a knife. “Katakana,” she says. “Same sounds, new costume. You will see it on every shop front.”",
 note:{title:'A second alphabet',html:"<p><b>Katakana</b> is the second kana set. It has the same sounds as hiragana but different, sharper shapes: ア is the twin of あ. It is used mainly for words borrowed from other languages (コーヒー, coffee), foreign names, and for emphasis, a bit like italics.</p><p class='muted'>You will read it every day on menus, signs and apps.</p>"},
 teaser:"At the café window Mika points at a menu. The first thing on it is a drink you already know, written in a script you almost can read. Tomorrow: the K row, and a line that stretches sounds.",
 persona:"Mika, the learner's friend, at Shibuya Crossing, pointing at katakana signs and asking the learner to read them.",stage:"The learner has just started katakana. Use only one or two words per turn."},
12:{title:'The Café Menu',place:'A café near Shibuya Station',
 story:"A tiny café, a menu full of katakana, and a barista who loves it when you try to read. Mika orders ケーキ for both of you. “That line,” she says, tapping ー. “It stretches a sound.”",
 note:{title:'The long-vowel line ー',html:"<p>In katakana a long vowel is written with a line: <b>ー</b>. <b>ケーキ</b> is ke-e-ki: hold the first vowel for two beats. <b>カー</b> is ka-a. In horizontal writing the line lies flat; in vertical writing it stands upright.</p><p class='muted'>Hiragana does this differently: long vowels use extra vowel kana, like おかあさん.</p>"},
 teaser:"The cake arrives with a tiny paper flag shaped like a letter you have not learned yet. Tomorrow: the S row.",
 persona:"The friendly café barista, speaking slowly and pointing at menu items.",stage:"The learner knows hiragana and the vowel and K rows of katakana, plus the long-vowel line."},
13:{title:'Ueno in the Cold',place:'Ueno Park',
 story:"Mika drags you through Ueno Park to a stall selling アイス even in the cold. “In Japan you eat ice cream in winter and nobody finds it strange.” The sign uses three new kana. Two of them look like each other.",
 note:{title:'シ and ツ look alike',html:"<p>Learners mix up <b>シ</b> (shi) and <b>ツ</b> (tsu), and later <b>ソ</b> (so) and <b>ン</b> (n). In シ the two dashes are nearly flat and the long stroke rises; in ツ the dashes stand more upright and the long stroke falls. Your Den will catch these. That is normal, and it is how you fix them.</p>"},
 teaser:"A taxi splashes through the puddle by the park gate. Tomorrow: the T row, and why English words get extra vowels.",
 persona:"A friendly ice-cream seller in Ueno Park.",stage:"The learner knows katakana vowels, K and S rows."},
14:{title:'The Taxi Rank',place:'Tokyo Station',
 story:"Tokyo Station has more exits than you have kana. Mika flags a タクシー and the door opens by itself. The driver reads the address back to you slowly, a few kana at a time.",
 note:{title:'Japanese adds vowels',html:"<p>Japanese syllables end in a vowel (except ん). So borrowed words get vowels slotted in: taxi becomes <b>タクシー</b> (ta-ku-shi-i), test becomes <b>テスト</b> (te-su-to). Read each kana first, then listen for the English hiding behind it.</p>"},
 teaser:"The taxi stops in a neon district where every shop sells something electric. Tomorrow: the N row, in Akihabara.",
 persona:"A polite taxi driver in Tokyo.",stage:"The learner knows katakana vowels, K, S and T rows. Use one word per turn."},
15:{title:'Neon and Necktie',place:'Akihabara',
 story:"Akihabara: arcades, maid cafés, towers of anime posters. A shop sells ネクタイ next to a stall of ナイス t-shirts. Mika shrugs: “The English is decoration. The sound is the point.”",
 note:{title:'Sound it out, then guess',html:"<p>Many katakana words are English, but shaped by Japanese sounds, so you must say them out loud first. <b>テニス</b> is tennis, <b>ナース</b> is nurse. Some words drift in meaning, so check the quiz and the glossary before you trust a guess.</p>"},
 teaser:"Mika's phone buzzes and she decides to take you somewhere calmer, with crepes. Tomorrow: the H row, in Harajuku.",
 persona:"A shop assistant in Akihabara, showing items one at a time.",stage:"The learner knows katakana vowels and K, S, T, N rows."},
16:{title:'Crepes in Harajuku',place:'Takeshita Street, Harajuku',
 story:"Takeshita Street is a river of people, colours and sugar. Mika buys two crepes and a コーヒー for herself and says: “Order at the next stall, by yourself.”",
 note:{title:'ヘ is almost へ',html:"<p><b>ヘ</b> is almost the same shape as hiragana <b>へ</b>. They are the only pair of kana that look alike across the two scripts. Context tells you which one you are reading. The other four H-row katakana are clearly different: ハ, ヒ, フ, ホ.</p>"},
 teaser:"A tourist asks for the way to the station and you realise you could not answer yet. Tomorrow: the M row, in Ginza.",
 persona:"A crepe-stall owner in Harajuku.",stage:"The learner knows katakana through the H row."},
17:{title:'Ginza Window Shopping',place:'Ginza',
 story:"Ginza is shiny and quiet. Mika shows you a billboard for a new スマホ and explains that Japan likes to cut long loanwords short, like スマートフォン into スマホ.",
 note:{title:'Short and snappy',html:"<p>Japanese often shortens long loanwords to four beats: <b>スマートフォン</b> became <b>スマホ</b> (smartphone), <b>アニメーション</b> became <b>アニメ</b> (animation). Once you see the pattern, you can often guess the full word.</p>"},
 teaser:"Rain starts. Mika leads you into a hotel lobby to wait it out. Tomorrow: the Y and R rows.",
 persona:"A shop assistant in Ginza.",stage:"The learner knows katakana through the M row."},
18:{title:'The Hotel Lobby',place:'A hotel lobby, Ginza',
 story:"The ホテル lobby has a tiny library, a tiny garden and a tiny desk where a clerk bows slightly as you walk in. You need a タオル. She needs you to ask for it in the right script.",
 note:{title:'The Japanese R',html:"<p>The R row is neither English r nor l. Tap the tip of your tongue once on the ridge behind your upper teeth, like the middle of “butter” said quickly in American English. Say ra, ri, ru, re, ro with one light tap each.</p><p class='muted'>Hearing the difference between ra and la will come with practice. The Den will help.</p>"},
 teaser:"Back in the street, an advert for ラーメン fills the screen. Only one more row to learn it. Tomorrow: ワ, ヲ, ン, and the little kana.",
 persona:"A hotel clerk who bows and speaks slowly.",stage:"The learner knows katakana through the R row."},
19:{title:'Ramen at Midnight',place:'Shinjuku at night',
 story:"Shinjuku after dark: red lanterns, ticket machines, ラーメン steam. The machine in front of you sells a チケット for the counter. Mika stands behind you and says nothing, because you are doing it yourself.",
 note:{title:'ン, small ッ, small ャ ュ ョ',html:"<p><b>ン</b> is the lone “n”. A small <b>ッ</b> is a pause, not a sound: it doubles the next consonant. <b>チケット</b> is chi-ke-t-to: hold the closed mouth for one beat before the “t”.</p><p>A small <b>ャ ュ ョ</b> fuses with the kana before it into one beat: <b>ニュース</b> is nyū-su, three beats. A full-size ユ would give ni-yu, a different word. Hiragana uses the same trick (Day 21).</p>"},
 teaser:"On the way home Mika waves at a glowing doorway. Tomorrow: two ticks, a circle, and the konbini.",
 persona:"A ramen shop counter clerk, speaking slowly.",stage:"The learner knows all basic katakana, including ン and small ッ ャ ュ ョ."},
20:{title:'Konbini Run',place:'A convenience store',
 story:"A コンビニ at 1 a.m., a tiny city of snacks. The ticket for your last train is in your pocket. Every product has two ticks or a circle on it somewhere, and you can now read them all.",
 note:{title:'Same ticks, new script',html:"<p>゛ and ゜ work exactly as they did in hiragana: カ → ガ, ハ → バ → パ. Today you learn all 25 voiced katakana in five short groups. You already know the idea, so the new part is only the shapes.</p>"},
 teaser:"Katakana is yours. The sun comes up and Mika has something harder planned: real Japanese sounds you have not written yet. Tomorrow: small ゃ ゅ ょ and っ.",
 persona:"A konbini clerk, speaking slowly and pointing at goods.",stage:"The learner knows all hiragana and katakana, including voiced kana, but few grammar words."},
21:{title:'Morning in Asakusa',place:'Asakusa, Senso-ji',
 story:"Early light at Senso-ji. A sign says きょう, today, and a shop opens with a rattle. Mika tells you the last piece of the sound system: the little kana. There are no new shapes to learn, only a new way to read.",
 note:{title:'Small ゃ ゅ ょ and っ',html:"<p>A small <b>ゃ ゅ ょ</b> fuses with the kana before it into one beat: き + ょ = <b>きょ</b> (kyo). Compare <b>きよ</b> (ki-yo) with two beats. A small <b>っ</b> is a pause that doubles the next consonant: <b>がっこう</b> (gak-kō), <b>きっぷ</b> (kip-pu).</p><div class='sents'><div><span class='jp'>きゃ</span> kya &nbsp; <span class='jp'>きゅ</span> kyu &nbsp; <span class='jp'>きょ</span> kyo</div><div><span class='jp'>しゃ</span> sha &nbsp; <span class='jp'>しゅ</span> shu &nbsp; <span class='jp'>しょ</span> sho</div><div><span class='jp'>ちゃ</span> cha &nbsp; <span class='jp'>ちゅ</span> chu &nbsp; <span class='jp'>ちょ</span> cho</div><div><span class='jp'>にゃ</span> nya &nbsp; <span class='jp'>ひゃ</span> hya &nbsp; <span class='jp'>みゃ</span> mya &nbsp; <span class='jp'>りゃ</span> rya</div><div><span class='jp'>じゃ</span> ja &nbsp; <span class='jp'>じゅ</span> ju &nbsp; <span class='jp'>じょ</span> jo &nbsp; (and ぎゃ gya, びゃ bya, ぴゃ pya)</div></div><p class='muted'>Long vowels in hiragana add a vowel kana: <b>おう</b> and <b>えい</b> are usually long o and long e (きょう kyō, せんせい sensei), <b>ああ いい うう</b> are doubled.</p>"},
 teaser:"The shop owner hands you a paper bag and says a string of phrases too fast. You smile and nod, which is how every learner begins. Tomorrow: greetings you can use right away.",
 persona:"A friendly Asakusa shopkeeper using only simple, known words.",stage:"The learner can read all kana including small ゃゅょっ. Use short turns."},
22:{title:'Say Hello Properly',place:'A neighbourhood street, Ueno',
 story:"A neighbour sweeps her step and calls out to you. You freeze. Mika whispers: “Greetings are the cheapest way to make people like you. Learn five and you are halfway.”",
 note:{title:'Greetings, and the は that says wa',html:"<p><b>こんにちは</b> (hello) and <b>こんばんは</b> (good evening) end in は, but it is read <b>wa</b>, not ha. It is a left-over from longer phrases, the same は as the topic marker. In the morning: <b>おはようございます</b> (polite) or <b>おはよう</b> (casual).</p><p><b>すみません</b> means excuse me, sorry, and thank you for going to the trouble, all in one. <b>ごめんなさい</b> is a more personal sorry.</p>"},
 teaser:"The neighbour bows and asks your name. You realise you do not know how to say it. Tomorrow: introductions.",
 persona:"A neighbour in Ueno who greets the learner and says one simple phrase at a time.",stage:"The learner knows greeting words and basic kana. Greet, then ask the learner to repeat or answer はい."},
23:{title:'Meet the Hostel',place:'A hostel common room',
 story:"The hostel common room smells of tea and noodles. Four travellers look up. Mika nudges you: “Name. Say your name.”",
 note:{title:'わたしは ... です',html:"<p>The core sentence: <b>わたしは (name) です。</b> は marks the topic, です works like “am / is / are”. To ask a question, add <b>か</b> at the end: <b>がくせい ですか。</b> means “Are you a student?”. No question mark is needed.</p><p><b>さん</b> goes after someone else's name, never your own: <b>たなかさん</b>. Japanese avoids あなた (you) and uses the name or title instead.</p>"},
 teaser:"Someone slides a plate of something unfamiliar across the table. Mika shrugs. Tomorrow: これ, それ, あれ.",
 persona:"A friendly hostel resident, asking who the learner is.",stage:"The learner knows greetings and the intro words. Practise: わたしは ... です, ... ですか, はい, いいえ."},
24:{title:'What Is That?',place:'Tsukiji outer market',
 story:"A market of unlabelled boxes, steam and shouting. Everything looks edible and mysterious. Mika says: “One sentence will get you through half of Japan.”",
 note:{title:'これ・それ・あれ',html:"<p><b>これ</b> is near me, <b>それ</b> is near you, <b>あれ</b> is far from both. <b>これは なんですか。</b> means “What is this?” and the answer is <b>それは ペンです。</b> The same idea gives places: <b>ここ</b> here, <b>そこ</b> there (near you), <b>あそこ</b> over there, <b>どこ</b> where.</p>"},
 teaser:"You point at something, they bag it, and the bag is heavy. Tomorrow: how to ask for it, and how much.",
 persona:"A friendly market stall owner, asking and answering これ/それ/あれ questions.",stage:"The learner knows greetings, intros, これ, それ, あれ, どこ and なん. One short question per turn."},
25:{title:'Please Give Me Tea',place:'A teahouse counter',
 story:"At a tiny counter, a woman pours tea into a cup the size of an egg. You want one for Mika too. Time to use the real ordering sentence.",
 note:{title:'(thing) を ください',html:"<p><b>(thing) を ください。</b> means “Please give me (thing)”. を marks what you are asking for. For small things count: <b>ひとつ</b> one, <b>ふたつ</b> two, <b>みっつ</b> three. <b>おちゃを ふたつ ください。</b> Two teas, please. Ask a price: <b>いくらですか。</b>.</p>"},
 teaser:"The woman bows, says a number, and you realise you cannot read it. Tomorrow: numbers.",
 persona:"A teahouse owner taking an order, using only simple known words.",stage:"The learner can order with を ください and ask いくら. Keep prices out; ask only what and how many (use ひとつ, ふたつ, みっつ)."},
26:{title:'Vending-Machine Alley',place:'A backstreet full of vending machines',
 story:"Every second doorway in this alley is a vending machine. Each has numbers, and the numbers have two readings. Mika grins: “This is the fun part.”",
 note:{title:'Numbers 1 to 10',html:"<p><b>いち</b> 1, <b>に</b> 2, <b>さん</b> 3, <b>よん</b> 4, <b>ご</b> 5, <b>ろく</b> 6, <b>なな</b> 7, <b>はち</b> 8, <b>きゅう</b> 9, <b>じゅう</b> 10, <b>ゼロ</b> 0.</p><p>4 and 7 have second readings, <b>し</b> and <b>しち</b>. し sounds like the word for death, so よん is often preferred, and なな is common for 7. Learn it as a chant, aloud, once a day.</p>"},
 teaser:"A glowing display above the station says a time in numbers. Tomorrow: telling the time.",
 persona:"Mika, counting items from a vending machine with the learner.",stage:"The learner knows numbers 1 to 10 and basic ordering. Ask only about numbers and ひとつ/ふたつ/みっつ."},
27:{title:'The Timetable',place:'Tokyo Station platforms',
 story:"The Shinkansen board scrolls in a language you now half understand. Trains leave at a time, not “around” a time. Mika says: “Never be late to a Japanese train. It leaves exactly when it says.”",
 note:{title:'Telling the time',html:"<p>Add <b>じ</b> to a number for o'clock: <b>さんじ</b> 3:00, <b>ごじ</b> 5:00. Exceptions to remember: 4 o'clock is <b>よじ</b> (not よんじ), 7 is <b>しちじ</b>, 9 is <b>くじ</b> (not きゅうじ). <b>いま なんじ ですか。</b> means “What time is it now?”. <b>ごぜん</b> is a.m. and <b>ごご</b> is p.m.</p>"},
 teaser:"A sign says the train is two minutes late, and the whole platform apologises. You realise you now need to ask where something is. Tomorrow: where?",
 persona:"A station attendant at Tokyo Station, speaking slowly.",stage:"The learner can use numbers 1 to 10, o'clock times with じ, and now/tomorrow/yesterday."},
28:{title:'Lost in Shinjuku',place:'Shinjuku Station',
 story:"Shinjuku Station has more than 200 exits and about 3.5 million passengers a day. You are separated from Mika near the ticket gates and have one working sentence in your pocket.",
 note:{title:'... は どこですか',html:"<p>The most useful travel sentence: <b>トイレは どこですか。</b> “Where is the toilet?”. The pattern is <b>(place) は どこですか</b>. Directions: <b>みぎ</b> right, <b>ひだり</b> left, <b>まっすぐ</b> straight ahead. A typical answer: <b>あそこです。</b> “It is over there.”</p>"},
 teaser:"You find Mika by the exit. She is not alone: a friend from the hostel has brought you both to dinner. Tomorrow: food.",
 persona:"A helpful station attendant in Shinjuku giving simple directions.",stage:"The learner can ask 'where is ...' and understand みぎ, ひだり, まっすぐ, あそこ."},
29:{title:'Izakaya Evening',place:'An izakaya near Shinjuku',
 story:"A low wooden table, paper menus, the smell of grilled everything. Your friends say いただきます. You do not know what to do with your hands. Mika taps the table and the waiter comes.",

/* particles and extra forms the tutor may use, by the day each is taught */
const KAMA_GRAMMAR=[[31,'へ'],[31,'に'],[31,'と'],[32,'が'],[36,'じゃありません'],[37,'でした'],[40,'ね'],[40,'よ'],[47,'で'],[47,'から'],[47,'まで'],[46,'います'],[55,'とっても'],[55,'みても'],[55,'すわっても'],[55,'たべても'],[55,'つかっても'],[57,'そうですね'],[60,'じゃあ']];

/* generate polite negative/invite/past forms for each ます verb, and -くないです/-かったです for い-adjectives */
const ADJ_I=['たかい','やすい','おおきい','ちいさい','あたらしい','ふるい','わるい','あつい','つめたい','おいしい','さむい','すずしい','あたたかい','たのしい','むずかしい','やさしい','おもしろい','いそがしい','ちかい','とおい','いたい','ほしい'];
function genForms(words){
  words.forEach(([day,j])=>{
    if(/ます$/.test(j)){
      const st=j.slice(0,-2),d1=Math.max(day,36),d2=Math.max(day,37);
      KAMA_GRAMMAR.push([d1,st+'ません'],[d1,st+'ませんか'],[d1,st+'ましょう'],[d2,st+'ました'],[d2,st+'ませんでした']);
    }
    if(ADJ_I.includes(j)){const st=j.slice(0,-1);KAMA_GRAMMAR.push([Math.max(day,36),st+'くないです'],[Math.max(day,37),st+'かったです']);}
  });
}
(function(){
  genForms(KWORDS.concat(KAMA_WORDS));
  KAMA_GRAMMAR.push([10,'たべません'],[36,'たべません'],[36,'たべませんか'],[37,'たべました']);
  ['たべ','のみ','いき','み','かい','し'].forEach(st=>KAMA_GRAMMAR.push([48,st+'たいです'],[48,st+'たくないです']));
})();

31:{title:'The Enoden Rattles Out',place:'Kamakura Station and the Enoden line',focus:'いきます, きます, かえります with へ and に',
 story:'A small green train rattles out of Fujisawa along the coast. Mika grins: Tokyo was the alphabet; this is where you start saying things. You buy two きっぷ and the first sentence of the day is yours to make.',
 note:{title:'Going and coming: へ',html:"<p>Polite verbs end in <b>ます</b>. <b>いきます</b> go, <b>きます</b> come, <b>かえります</b> return home. The particle <b>へ</b> (read <b>e</b>, not he) marks where you go: <b>かまくらへ いきます。</b> I go to Kamakura. <b>どこへ いきますか。</b> Where are you going?</p><p>Add <b>いっしょに</b> for together. Japanese often drops <b>わたしは</b> when it is obvious.</p>"},
 teaser:'The line runs along the sea and stops at a small station where a bronze giant sits in the next valley. Tomorrow: there is, and there are.'},
32:{title:'The Great Buddha',place:'Kōtoku-in, Kamakura',focus:'あります and います with に',
 story:'The Great Buddha has sat in the open air for centuries, ever since the hall around him was lost to a storm and a tidal wave. Mika points at the temple, the trees and a cat on a wall. How do you say there is?',
 note:{title:'あります and います',html:"<p>Two verbs for existing. <b>あります</b> is for things and plants: <b>てらが あります。</b> There is a temple. <b>います</b> is for people and animals: <b>ねこが います。</b> There is a cat. The place takes <b>に</b>: <b>こうえんに ねこが います。</b></p><p>Careful with the pair: ふたり and ひとり are people, so use います.</p>"},
 teaser:'A kind woman at the gate asks what you would like to see next. You realise you do not have enough verbs. Tomorrow: seeing, reading, buying.'},
33:{title:'Verbs and Objects',place:'A stall below the temple',focus:'を with みます, よみます, かいます',
 story:'The stall owner sells postcards, tea and tiny stone Buddhas. She asks what you do and what you want. You have the sentence skeleton; today you give it a verb.',
 note:{title:'を and the verb at the end',html:"<p>The object takes <b>を</b> and the verb goes last: <b>てがみを かきます。</b> I write a letter. <b>おちゃを のみます。</b> I drink tea. <b>ほんを よみます。</b> I read a book. Japanese puts the verb at the very end, so the listener waits for your last word.</p><p><b>します</b> (do) joins nouns: <b>さんぽ</b> + <b>します</b>.</p>"},
 teaser:'You buy a hand-painted postcard that costs more than you expected. Tomorrow: expensive, cheap, big, small.'},
34:{title:'Komachi Street',place:'Komachi-dōri',focus:'い-adjectives: たかい, やすい, おおきい',
 story:'Komachi-dōri is a narrow street of sweets, sandals and sword-shaped snacks. Everything looks interesting. Everything looks either たかい or やすい. Mika lets you decide.',
 note:{title:'い-adjectives',html:"<p>Many describing words end in <b>い</b>: <b>たかい</b> expensive, <b>やすい</b> cheap, <b>おおきい</b> big. They work before a noun (<b>たかい ほん</b>) or at the end of a sentence with です: <b>これは たかいです。</b> Watch out: <b>いい</b> (good) is irregular, and <b>きれい</b> looks like an い-adjective but is not (tomorrow).</p>"},
 teaser:'A shopkeeper says your pronunciation is quite good, and also warns you about the crowd. Tomorrow: more describing words.'},
35:{title:'Quiet and Lively',place:'Hasedera temple garden',focus:'な-adjectives: きれい, しずか, にぎやか',
 story:'Hasedera sits on a hill with a garden that blooms in every season and a view of the bay. After the noise of Komachi-dōri it feels like another town. Mika just says しずか and waits for you to join in.',
 note:{title:'な-adjectives',html:"<p>A second group of describing words does not end in い: <b>きれい</b>, <b>しずか</b>, <b>にぎやか</b>, <b>ゆうめい</b>, <b>げんき</b>. They behave like nouns: <b>ここは しずかです。</b> Before a noun they add <b>な</b>: <b>しずかな てら</b>. <b>すき</b> and <b>きらい</b> belong here too: <b>わたしは ねこが すきです。</b></p><p><b>じょうず</b> and <b>へた</b> describe skill: <b>うたが じょうずです。</b></p>"},
 teaser:'A guide asks if you want to try the next temple. You want to say no politely. Tomorrow: ません.'},
36:{title:'Saying No, Inviting',place:'A teahouse by the beach',focus:'ません, じゃありません, ませんか, ましょう',
 story:'Mika suggests the beach. It is cold. You need two things at once: a way to say no, and a way to say let us. Both are about to appear.',
 note:{title:'Negatives and invitations',html:"<p>Polite negative: <b>ます</b> becomes <b>ません</b>: <b>いきません</b> I do not go. Nouns and な-adjectives: <b>じゃありません</b>. い-adjectives: drop い, add <b>くないです</b>: <b>たかくないです</b>. Invite with <b>ませんか</b>: <b>いっしょに いきませんか。</b> Will you come with me? Agree with <b>ましょう</b> (let us): <b>いきましょう。</b></p><p><b>ぜんぜん</b> and <b>あまり</b> need a negative: <b>あまり たかくないです。</b> Not very expensive.</p>"},
 teaser:'The beach is empty except for a surfer in a thick wetsuit. Mika says you have just used the most polite invitation in Japanese. Tomorrow: yesterday and the days of the week.'},
37:{title:'Yesterday and Saturday',place:'Yuigahama beach',focus:'ました, でした, days of the week',
 story:'By evening the sky is orange and the surfers are gone. Mika asks what you did yesterday. You only have the present tense so far.',
 note:{title:'The past, and the week',html:"<p>Past polite: <b>ました</b> for verbs: <b>たべました</b> I ate, <b>いきませんでした</b> I did not go. <b>でした</b> for nouns and な-adjectives: <b>きのうは あめでした。</b> い-adjectives: <b>〜かったです</b>: <b>おいしかったです。</b></p><p>The days end in <b>ようび</b>: <b>げつ</b> moon (Mon), <b>か</b> fire, <b>すい</b> water, <b>もく</b> tree, <b>きん</b> gold, <b>ど</b> earth, <b>にち</b> sun (Sun). Later you will see these as 月火水木金土日.</p>"},
 teaser:'A fisherman shows you the day\'s catch and says a number that sounds like a lot. Tomorrow: big numbers and yen.'},
38:{title:'Counting Yen',place:'A fish market in Kamakura',focus:'numbers to 10,000 and えん',
 story:'The fishmonger says a number and you hear only the first syllable. Mika writes it on your hand. It is a hundred, and a half.',
 note:{title:'Numbers past ten',html:"<p>Eleven is ten-one: <b>じゅういち</b>. Twenty is two-ten: <b>にじゅう</b>. Fifty: <b>ごじゅう</b>. One hundred <b>ひゃく</b>, one thousand <b>せん</b>, ten thousand <b>いちまん</b>. Japanese counts in ten-thousands: 100,000 is ten ten-thousands, <b>じゅうまん</b>. Money: <b>これは ごひゃくえんです。</b> 500 yen.</p><p class='muted'>Some hundreds change sound: 300 is <b>さんびゃく</b>, 600 <b>ろっぴゃく</b>, 800 <b>はっぴゃく</b>. Listen for them.</p>"},
 teaser:'You pay with a note that is bigger than you meant to use. The fishmonger smiles. Tomorrow: minutes, and how to say you are late.'},
39:{title:'On the Minute',place:'Kita-Kamakura Station',focus:'minutes: ふん and ぷん, はん',
 story:'The train to Kita-Kamakura leaves at the minute. Mika holds up three fingers, then five. You realise you can say the hour but not the rest of the time.',
 note:{title:'Minutes',html:"<p><b>〜ふん</b> or <b>〜ぷん</b> counts minutes: <b>いっぷん</b> 1, <b>にふん</b> 2, <b>さんぷん</b> 3, <b>ごふん</b> 5, <b>じゅっぷん</b> 10. Half past is <b>はん</b>: <b>さんじはん</b> 3:30. A full time: <b>ごじ じゅっぷん</b> 5:10. <b>なんぷんですか</b> asks how many minutes.</p><p><b>おくれます</b> means be late. <b>すみません、おくれました。</b> Sorry I was late.</p>"},
 teaser:'The train arrives in the minute you said it would. Mika says that is how Kamakura wants to be: calm, and exactly on time. Tomorrow: weather.'},
40:{title:'The Weather Today',place:'Engaku-ji temple',focus:'weather: あつい, さむい, あめ with ね and よ',
 story:'Engaku-ji sits in a cedar forest and the air is colder than Tokyo. Mika blows into her hands. You have the first word of a small-talk sentence that every Japanese person says first.',
 note:{title:'Small talk and ね, よ',html:"<p>Japanese small talk starts with the weather: <b>きょうは さむいですね。</b> Add <b>ね</b> to ask the listener to agree: right? Add <b>よ</b> to tell something: <b>あしたは あめですよ。</b> You know it and I am telling you. Weather words: <b>あめ</b>, <b>ゆき</b>, <b>くもり</b>, <b>はれ</b>.</p>"},
 teaser:'Mika says every conversation in Japan begins with weather, and then asks about your family. Tomorrow: family.'},
41:{title:'My Family and Yours',place:'A traditional house cafe',focus:'family words, mine and yours',
 story:'The cafe owner shows photos of her family on a wall. Mika points at each one. You find there are two sets of words: one for your family and one for theirs.',
 note:{title:'Family words, two ways',html:"<p>When you talk about someone else's family you use polite words: <b>おかあさん</b>, <b>おとうさん</b>, <b>おにいさん</b>, <b>おねえさん</b>. About your own family to others you use plain words: <b>はは</b>, <b>ちち</b>, <b>あに</b>, <b>あね</b>. Younger siblings: <b>いもうと</b> and <b>おとうと</b> for your own, and add <b>さん</b> for someone else's (<b>いもうとさん</b>). <b>かぞくは なんにんですか。</b> asks how many in the family.</p>"},
 teaser:'The owner asks you about your friends, and you realise you do not have the words for who is who. Tomorrow: people.'},
42:{title:'Who Is Who',place:'A teahouse in Kita-Kamakura',focus:'ともだち, ひと, わたしの, の',
 story:'A group of schoolchildren is on a trip. They look at you, whisper, and one asks Mika who you are. Mika grins and passes the question to you.',
 note:{title:'の and people',html:"<p><b>の</b> links two nouns: <b>わたしの ともだち</b> my friend, <b>せんせいの ほん</b> the teacher's book. <b>だれの ほんですか。</b> Whose book is it? <b>ぼく</b> is a casual I used mostly by males, <b>わたし</b> is safe for everyone. <b>かれ</b> and <b>かのじょ</b> mean he and she but also boyfriend and girlfriend, so use names instead when unsure.</p>"},
 teaser:'The children ask what you like. You cannot say yet. Tomorrow: likes and wants.'},
43:{title:'What Do You Like?',place:'A small cat cafe',focus:'すき, きらい, ほしい with が',
 story:'A cafe with six cats and a menu that says nothing about coffee. Mika sits down and a grey one climbs onto her lap. She asks what animals you like and you realise you can answer.',
 note:{title:'Likes and wants take が',html:"<p>The thing you like takes <b>が</b>: <b>ねこが すきです。</b> I like cats. <b>いぬが きらいです。</b> I dislike dogs. Want a thing: <b>ほしい</b>: <b>あたらしい かばんが ほしいです。</b> <b>えいが</b>, <b>おんがく</b> and <b>スポーツ</b> are the usual hobby words.</p>"},
 teaser:'The cat steps off Mika\'s lap onto yours and stays there. The cafe owner calls it a good sign. Tomorrow: hobbies.'},
44:{title:'Weekend Hobbies',place:'A walking trail above Kamakura',focus:'しゅみ and action verbs',
 story:'A trail climbs through bamboo to a viewpoint above the sea. Mika says walking is her しゅみ and asks what yours is. You have the vocabulary; you just have to be brave.',
 note:{title:'Talking about hobbies',html:"<p><b>しゅみは なんですか。</b> What is your hobby? <b>しゅみは さんぽです。</b> My hobby is walking. For an action: <b>うたを うたいます。</b> I sing songs. <b>およぎます</b> swim, <b>あるきます</b> walk, <b>はしります</b> run. <b>ならいます</b> is to learn from a teacher, which is what you are doing now.</p>"},
 teaser:'At the top of the trail a hiker asks you to take a photo of him with the view. Tomorrow: asking people to do things.'},
45:{title:'Please Do It',place:'A lookout above the bay',focus:'〜て ください',
 story:'The hiker hands you his phone and asks something fast. You catch only the last word, ください. Mika whispers the part you missed.',
 note:{title:'The te-form',html:"<p>The <b>て-form</b> links and asks. <b>〜て ください</b> means please do: <b>みて ください</b> please look, <b>まって ください</b> please wait, <b>ゆっくり はなして ください</b> please speak slowly. Its shape depends on the verb group. Group 2 verbs (<b>たべる</b>, <b>みる</b>, <b>おきる</b>, <b>ねる</b>): drop <b>る</b>, add <b>て</b>: <b>たべて</b>, <b>みて</b>. Group 1 verbs, by their dictionary ending: <b>う つ る</b> → <b>って</b> (<b>まつ → まって</b>), <b>む ぶ ぬ</b> → <b>んで</b> (<b>よむ → よんで</b>), <b>く</b> → <b>いて</b> (<b>かく → かいて</b>), <b>ぐ</b> → <b>いで</b> (<b>およぐ → およいで</b>), <b>す</b> → <b>して</b> (<b>はなす → はなして</b>). One exception: <b>いく → いって</b>. For now, learn each te-form together with its verb.</p>"},
 teaser:'The hiker thanks you and says you can ask him questions in return. Tomorrow: what you are doing, and what jobs people have.'},
46:{title:'What Do You Do?',place:'A bench by Kotoku-in pond',focus:'〜て います and jobs',
 story:'The hiker is an engineer on holiday. He asks what you do. You say something short, he nods, and the conversation continues.',
 note:{title:'Doing right now, and jobs',html:"<p><b>〜て います</b> means doing now: <b>べんきょうして います。</b> I am studying. Jobs: <b>がくせい</b> student, <b>いしゃ</b> doctor, <b>エンジニア</b> engineer, <b>かいしゃいん</b> office worker. <b>おしごとは なんですか。</b> What is your job?</p>"},
 teaser:'The hiker writes his email address on your phone. You do not know how to ask what he means by the word. Tomorrow: transport.'},
47:{title:'By Train, By Foot',place:'Kamakura to Enoshima',focus:'で for transport, から, まで, かかります',
 story:'The Enoden clatters towards Enoshima past the sea wall and a Shonan surf shop. Mika points at the line on the map and asks how long it will take.',
 note:{title:'で, から, まで',html:"<p><b>で</b> marks the means: <b>でんしゃで いきます。</b> I go by train. <b>あるいて いきます。</b> I go on foot (no で). <b>から</b> is from and <b>まで</b> is to: <b>かまくらから えのしままで。</b> From Kamakura to Enoshima. <b>どのくらい かかりますか。</b> How long does it take? <b>さんじゅっぷん かかります。</b></p>"},
 teaser:'Enoshima has a shrine, a lighthouse and a place for lunch. Tomorrow: wanting to do things.'},
48:{title:'I Want To',place:'Enoshima island',focus:'〜たいです',
 story:'At the top of the island steps Mika says she wants to eat grilled shirasu. You say you want to see the lighthouse. She says okay.',
 note:{title:'Saying you want to do something',html:"<p>Drop <b>ます</b> and add <b>たいです</b>: <b>たべたいです</b> I want to eat, <b>いきたいです</b> I want to go. For a thing you want, use <b>ほしいです</b>. Negative: <b>〜たくないです</b>. <b>やすみ</b> is a day off or a holiday: <b>やすみに うみへ いきたいです。</b></p>"},
 teaser:'You climb to the lighthouse and the whole bay opens up. Mika says that is where she met her best friend. Tomorrow: where things are.'},
49:{title:'Where Is It?',place:'Enoshima shrine street',focus:'うえ, した, なか, となり with に',
 story:'A seller on the shrine street cannot find his change. His daughter points under the counter. The language of location is about to become useful.',
 note:{title:'Position words',html:"<p>Position words follow の: <b>つくえの うえ</b> on the desk, <b>かばんの なか</b> in the bag, <b>えきの となり</b> next to the station, <b>てらの うしろ</b> behind the temple. Full pattern: <b>えきの ちかくに コンビニが あります。</b> There is a convenience store near the station.</p>"},
 teaser:'The seller finds his change under a box of postcards and gives you a discount for the help. Tomorrow: colours.'},
50:{title:'Colours of the Coast',place:'Enoshima aquarium',focus:'colours',
 story:'The aquarium glows with jellyfish and fish in every colour. Mika names them for you and tests you, one tank at a time.',
 note:{title:'Colours',html:"<p><b>あか</b> red, <b>あお</b> blue, <b>しろ</b> white, <b>くろ</b> black, <b>きいろ</b> yellow, <b>みどり</b> green, <b>ちゃいろ</b> brown, <b>ピンク</b> pink. Four of them also have an い-adjective form: <b>あかい</b>, <b>あおい</b>, <b>しろい</b>, <b>くろい</b>: <b>あかい かばん</b>. Others need <b>の</b>: <b>みどりの かばん</b>.</p>"},
 teaser:'One jellyfish looks like it has a head. Mika says that is a good way to learn the next words. Tomorrow: body parts.'},
51:{title:'Head, Hand, Foot',place:'A small clinic in Kamakura',focus:'body words and いたい',
 story:'You pulled something on the trail. A doctor looks at your ankle and asks where it hurts. Mika waits outside, grinning.',
 note:{title:'Body and pain',html:"<p><b>あたま</b> head, <b>め</b> eye, <b>はな</b> nose (it is also the word for flower), <b>くち</b> mouth, <b>みみ</b> ear, <b>て</b> hand, <b>あし</b> foot or leg, <b>おなか</b> stomach. Say where it hurts: <b>あしが いたいです。</b> My foot hurts. <b>だいじょうぶですか。</b> Are you alright? is the doctor's first question.</p>"},
 teaser:'The doctor says rest and sleep. You wonder how to say that. Tomorrow: daily routine.'},
52:{title:'A Day in Kamakura',place:'A guesthouse near the sea',focus:'daily routine verbs',
 story:'The guesthouse owner shows you where the futon is, where breakfast is, and what time the bath opens. Everything has a time and a verb.',
 note:{title:'Daily routine',html:"<p><b>あさ しちじに おきます。</b> I get up at 7. <b>じゅうじに ねます。</b> I go to bed at 10. Times take <b>に</b>. Meals: <b>あさごはん</b>, <b>ひるごはん</b>, <b>ばんごはん</b>. <b>シャワーを あびます</b> take a shower. <b>しごとが はじまります</b> work starts.</p>"},
 teaser:'The owner says breakfast is at seven. You say you will be there. Tomorrow: this morning, tonight, next week.'},
53:{title:'This Week, Next Week',place:'A morning market',focus:'time words',
 story:'A vendor tells you the market is only open on weekdays this week and on Saturday next week. Mika writes it in your notebook.',
 note:{title:'Time words',html:"<p><b>けさ</b> this morning, <b>こんばん</b> tonight, <b>まいあさ</b> every morning, <b>まいばん</b> every evening, <b>こんしゅう</b> this week, <b>らいしゅう</b> next week, <b>せんしゅう</b> last week. <b>いつ</b> asks when: <b>いつ いきますか。</b> No particle after time words like <b>きょう</b> and <b>けさ</b>, but specific times take <b>に</b>.</p>"},
 teaser:'The vendor says come back for the big seasonal fair on the weekend. Tomorrow: counting people and things.'},
54:{title:'How Many?',place:'A fair stall near the beach',focus:'counters for people and things',
 story:'You need three tickets for a small show and the ticket seller needs to know how many people and how many sheets.',
 note:{title:'Counters',html:"<p>Japanese uses counters. People: <b>ひとり</b>, <b>ふたり</b>, then <b>さんにん</b>, <b>よにん</b>, <b>ごにん</b>. Flat things (tickets, paper): <b>いちまい</b>, <b>にまい</b>. Small items: <b>いっこ</b>, <b>にこ</b>. Ask: <b>なんにん</b> how many people, <b>なんこ</b> how many items. <b>きっぷを さんまい ください。</b> Three tickets, please.</p>"},
 teaser:'The ticket seller wishes you a fun show and asks if you want to take a photo. Tomorrow: asking permission.'},
55:{title:'May I?',place:'A shrine in Kamakura',focus:'〜ても いいですか',
 story:'A sign at the shrine has a camera with a line through it. You do not want to offend anyone. Mika says: ask.',
 note:{title:'Asking permission',html:"<p><b>〜ても いいですか。</b> May I? <b>しゃしんを とっても いいですか。</b> May I take a photo? The answer: <b>どうぞ。</b> Go ahead, or <b>だめです。</b> No, or <b>すみません、ちょっと…。</b> That is a polite refusal. <b>だいじょうぶです</b> can mean okay or no need, depending on tone.</p>"},
 teaser:'The priest says you can take pictures of the gate but not the hall. Tomorrow: comparing.'},
56:{title:'Which Is Better?',place:'A shoe shop in Kamakura',focus:'もっと, いちばん, どちら',
 story:'The shoe shop has two pairs that look the same. One is cheaper. Mika waits for you to ask the right question.',
 note:{title:'Comparing',html:"<p><b>どちらが いいですか。</b> Which is better? <b>こちらの ほうが やすいです。</b> This one is cheaper. <b>いちばん</b> means the most: <b>いちばん すきです。</b> <b>もっと</b> means more: <b>もっと ゆっくり おねがいします。</b> <b>すこし</b> a little, <b>たくさん</b> a lot, <b>ぜんぶ</b> everything, <b>おなじ</b> the same.</p>"},
 teaser:'You choose the cheaper pair and Mika says it is the right choice. Tomorrow: plans.'},
57:{title:'Weekend Plans',place:'A cafe on the hill',focus:'よてい, adjectives for opinions',
 story:'Mika asks what you are doing next weekend. You have nothing booked and an itinerary in your head. You find you can say what is fun and what is boring.',
 note:{title:'Plans and opinions',html:"<p><b>しゅうまつの よていは なんですか。</b> What are your plans for the weekend? <b>ひまです。</b> I am free. <b>いそがしいです。</b> I am busy. Opinions: <b>たのしい</b> fun, <b>つまらない</b> boring, <b>むずかしい</b> difficult, <b>やさしい</b> easy, <b>おもしろい</b> interesting. <b>〜でしょう</b> is isn't it, and <b>そうですね</b> is a friendly agreement.</p>"},
 teaser:'Mika says there is a festival tonight in Kamakura. Tomorrow: festivals and seasons.'},
58:{title:'The Festival',place:'Tsurugaoka Hachimangū',focus:'festival and season words',
 story:'Lanterns light the long approach to the shrine. Stalls sell grilled corn and candy. Mika hands you a paper fan and teaches you three words for the evening.',
 note:{title:'Festivals and seasons',html:"<p><b>おまつり</b> festival, <b>はなび</b> fireworks, <b>さくら</b> cherry blossoms, <b>もみじ</b> autumn maple leaves, <b>おみやげ</b> a souvenir, <b>おもいで</b> a memory, <b>おんせん</b> hot spring. <b>たのしみです</b> means I am looking forward to it. <b>さくらが きれいですね。</b> The cherry blossoms are pretty.</p>"},
 teaser:'Mika says the best souvenir is a friend. You ask for her number. Tomorrow: personal details.'},
59:{title:'Your Details',place:'A guesthouse lounge',focus:'じゅうしょ, でんわばんごう, なんさい',
 story:'You trade contact details with a table of travellers. Everyone does it differently. You give your ライン and promise to write.',
 note:{title:'Asking for details',html:"<p><b>でんわばんごうは なんばんですか。</b> What is your phone number? Say numbers one by one. <b>じゅうしょ</b> address, <b>ライン</b> LINE, <b>アドレス</b> email address. <b>おいくつですか。</b> or <b>なんさいですか。</b> asks age, but is considered rude with older people. <b>たんじょうびは いつですか。</b> When is your birthday?</p>"},
 teaser:'Mika says tomorrow she has a surprise for your last day in Kamakura. Tomorrow: the finale.'},
60:{title:'The Last Night in Kamakura',place:'Zaimokuza beach at dusk',focus:'past tense thanks and goodbyes',
 story:'The sun sets over Mt Fuji across the bay. Mika has something to tell you. You have thirty days of sentences behind you and one more sentence to say: thank you for everything.',
 note:{title:'Thanking and goodbyes',html:"<p><b>ありがとうございました。</b> Thank you for what you did (finished). <b>たのしかったです。</b> It was fun. <b>おいしかったです。</b> It was delicious. <b>またあした。</b> See you tomorrow, <b>じゃあ、また。</b> See you later. <b>がんばります</b> I will do my best, <b>がんばって</b> good luck.</p>"},
 teaser:'The sky turns purple and Hakone waits. Next region: Hakone, the first kanji, and longer sentences. (Coming in the next update.)'}
};

    k.words.forEach(w=>{if(!KVW[w.id]){KVW[w.id]=w;KJ_ALLWORDS.push(w);}});
  });
}

61:{title:'Ropeway Above the Valley',place:'Hakone-Yumoto Station',focus:'the first kanji: 一 二 三',

 note:{title:'What is a kanji?',html:"<p><b>Kanji</b> are characters borrowed from Chinese. Each one has a meaning, and most have more than one reading. The <b>kun</b> reading is the native Japanese word: <b>ひと</b>. The <b>on</b> reading is the Chinese-derived sound, used inside compounds: <b>いち</b>. You do not memorise them apart from words. Learn each kanji with a few words, and with a picture or story, and you will remember it.</p><p class='muted'>Tabi shows the stroke order. Trace it each time, because writing is what makes kanji stick.</p>"},

const CONJ_I={'う':'い','く':'き','ぐ':'ぎ','す':'し','つ':'ち','ぬ':'に','ぶ':'び','む':'み','る':'り'};
const CONJ_A={'う':'わ','く':'か','ぐ':'が','す':'さ','つ':'た','ぬ':'な','ぶ':'ば','む':'ま','る':'ら'};
const CONJ_E={'う':'え','く':'け','ぐ':'げ','す':'せ','つ':'て','ぬ':'ね','ぶ':'べ','む':'め','る':'れ'};
const CONJ_O={'う':'お','く':'こ','ぐ':'ご','す':'そ','つ':'と','ぬ':'の','ぶ':'ぼ','む':'も','る':'ろ'};
const CONJ_T={'う':'って','つ':'って','る':'って','む':'んで','ぶ':'んで','ぬ':'んで','く':'いて','ぐ':'いで','す':'して'};
function conjugate(d,g){
  const o={dict:d};
  if(g==='2'){const s=d.slice(0,-1);Object.assign(o,{stem:s,masu:s+'ます',nai:s+'ない',ta:s+'た',te:s+'て',pot:s+'られる',vol:s+'よう',pas:s+'られる',cau:s+'させる',ba:s+'れば'});if(d==='いる'){delete o.pot;delete o.pas;delete o.cau;}}
  else if(g==='3'){
    if(d.endsWith('くる')){const p=d.slice(0,-2);Object.assign(o,{stem:p+'き',masu:p+'きます',nai:p+'こない',ta:p+'きた',te:p+'きて',pot:p+'こられる',vol:p+'こよう',pas:p+'こられる',cau:p+'こさせる',ba:p+'くれば'});}
    else{const p=d.slice(0,-2);Object.assign(o,{stem:p+'し',masu:p+'します',nai:p+'しない',ta:p+'した',te:p+'して',pot:p+'できる',vol:p+'しよう',pas:p+'される',cau:p+'させる',ba:p+'すれば'});}
  }else{
    const l=d.slice(-1),s=d.slice(0,-1);
    const I=CONJ_I,A=CONJ_A,T=CONJ_T;
    let te=s+T[l];if(d==='いく')te='いって';
    o.stem=s+I[l];o.masu=s+I[l]+'ます';o.nai=d==='ある'?'ない':s+A[l]+'ない';o.te=te;o.ta=te.slice(0,-1)+(te.endsWith('て')?'た':'だ');o.ba=d==='ある'?'あれば':s+CONJ_E[l]+'ば';if(d!=='ある'){o.pot=s+CONJ_E[l]+'る';o.vol=s+CONJ_O[l]+'う';o.pas=s+CONJ_A[l]+'れる';o.cau=s+CONJ_A[l]+'せる';}
  }
  o.nakatta=o.nai.slice(0,-1)+'かった';
  return o;
}

97:{title:'Entrance, Exit',place:'Osu Kannon temple',focus:'出 入: 出口 and 入口',
 story:'The temple has one 入口 and one 出口, and a sign for each. These two are the most useful signs in Japan, and the kanji are simple.',
 note:null,
 teaser:'At the temple stairs Mika asks which way you want to go. Tomorrow: left and right.'},
98:{title:'Left, Right',place:'The stairs at Osu Kannon',focus:'右 左: left and right',
 story:'Stairs, an escalator, an elevator. Mika asks where the exit is, and you answer with your hand: 右 or 左.',
 note:{title:'Left and right',html:"<p><b>右</b> みぎ right, <b>左</b> ひだり left. Use them with に: <b>みぎに まがります。</b> Turn right. Both hand words follow the same pattern: <b>右手</b> みぎて, <b>左手</b> ひだりて.</p>"},
 teaser:'It starts to cloud over while you are on the stairs. Tomorrow: the weather.'},
99:{title:'Weather Words',place:'A cafe near Osu',focus:'天 気: weather',
 story:'The sky above Osu turns grey. Mika looks at the phone: 天気. You will see this word on every forecast, so now is a good time to learn it.',
 note:{title:'天気 and the weather',html:"<p><b>天気</b> てんき means weather. <b>いい 天気ですね。</b> Nice weather, isn't it. <b>気</b> also appears in <b>元気</b> (genki, you will meet 元 later) and <b>電気</b> でんき electricity, lights.</p>"},
 teaser:'The first drops fall on the pavement. Tomorrow: rain, and a grand old shrine.'},
100:{title:'Day 100: Rain at Atsuta',place:'Atsuta Shrine',focus:'雨 空: rain and sky',
 story:'One hundred days. Rain falls on the camphor trees of Atsuta Shrine, and Mika holds out one umbrella for two. You came here knowing no Japanese, and today you can read 雨 and 空.',
 note:{title:'A hundred days',html:"<p>One hundred days: both kana, over 550 words and 80 kanji. Rain: <b>あめが ふります</b> (it rains). <b>おおあめ</b> heavy rain. <b>そら</b> sky, <b>くうき</b> air.</p>"},
 teaser:'The rain stops and a bookshop on the way back is still open. Tomorrow: reading and writing.'},
101:{title:'Writing and Reading',place:'A bookshop in Osu',focus:'書 読: write and read',
 story:'The bookshop is full of manga, magazines and novels. Mika picks one up, then points to two kanji on the cover: 書 and 読.',
 note:null,
 teaser:'The shop owner asks where you are from, and you realise you need to speak. Tomorrow: speaking and listening.'},
102:{title:'Speaking and Listening',place:'A hitsumabushi restaurant',focus:'話 聞: talk and listen',
 story:'The chef explains how to eat hitsumabushi: eel on rice, first plain, then with toppings, then as soup. Mika says: you listen first, then you speak.',
 note:{title:'Three ways to eat hitsumabushi',html:"<p>Eat it the first way plain, the second with spring onion, nori and wasabi, the third as a soup with dashi or tea. The fourth way: whichever you liked best. 話す to speak, 聞く to listen (or to ask), 電話 telephone.</p>"},
 teaser:'The bill arrives and it is much more than Mika guessed. Tomorrow: buying things.'},
103:{title:'Buying at the Shop',place:'Osu street stalls',focus:'買 店: buy and shop',
 story:'Socks, toys, snacks, and a stall selling tiny golden shachihoko. You count your coins, point at 店, and say you will buy one.',
 note:null,
 teaser:'Your feet hurt, and there is a bench. Tomorrow: rest.'},
104:{title:'Resting',place:'A bench by Atsuta Shrine',focus:'休: rest and days off',
 story:'The kanji 休 is a person leaning on a tree. Mika sits down on the bench and does the same. Later today there is a long walk.',
 note:{title:'休み and 休日',html:"<p><b>やすみます</b> rest, take a day off. <b>休み</b> やすみ a holiday or a break: <b>あした 休みです。</b> Tomorrow is a day off. <b>休日</b> きゅうじつ is the formal word for a day off.</p>"},
 teaser:'Evening lights come on over the city. Tomorrow: tall and long.'},
105:{title:'The Tower',place:'Nagoya TV Tower, Sakae',focus:'長 高: long and tall',
 story:'The TV tower is tall and its steel legs look very long. From the observation deck Mika points at the 高い buildings and the 長い river of lights.',
 note:{title:'高い has two meanings',html:"<p><b>高い</b> たかい means tall or high, and also expensive: <b>たかい ビル</b> a tall building, <b>この ほんは 高いです。</b> This book is expensive. Context tells you which.</p>"},
 teaser:'From the top you can see a very large, very new building. Tomorrow: new things.'},
106:{title:'The Car Museum',place:'Toyota Commemorative Museum',focus:'新: new',
 story:'Nagoya makes cars. The museum starts with a loom and ends with machines that build cars. Mika reads 新しい, then 新聞, a newspaper from a day long ago.',
 note:null,
 teaser:'Tomorrow the kanji stop for a while. Mika says the next thing is the way Japanese really works: the verb.'},
107:{title:'The Dictionary Form: る-verbs',place:'A glass-roofed plaza in Sakae',focus:'plain forms: る-verbs',
 story:'Mika says: so far you speak politely. Today you meet the other layer of the language: the plain form, the one in dictionaries and in casual speech.',
 note:{title:'The dictionary form',html:"<p>You know the polite <b>ます</b> form. The dictionary form is the plain one. For <b>る-verbs</b> (ichidan), drop <b>ます</b> and add <b>る</b>: <b>たべます → たべる</b>, <b>みます → みる</b>, <b>おきます → おきる</b>. These always end in <b>いる</b> or <b>える</b>, but not every verb that ends that way is a る-verb. <b>かえる</b> (go home) is not: it belongs to tomorrow's group.</p>"},
 teaser:'Mika asks whether you can find the other group. Tomorrow: う-verbs.'},
108:{title:'The Dictionary Form: う-verbs',place:'A quiet street in Sakae',focus:'plain forms: う-verbs I',
 story:'Most Japanese verbs are in the other group. Mika writes five of them on a napkin and asks you to find what they have in common: the last sound moves one place.',
 note:{title:'う-verbs (godan)',html:"<p>The い-sound before ます moves to the matching う-sound in the same row: <b>き → く</b> かきます → かく; <b>ぎ → ぐ</b> およぎます → およぐ; <b>し → す</b> はなします → はなす; <b>い → う</b> かいます → かう, あいます → あう. Tomorrow you meet the rest.</p>"},
 teaser:'Mika says there are four more endings. Tomorrow: つ, る, む, ぶ.'},
109:{title:'More う-verbs, and Two Irregulars',place:'A cafe by the river in Sakae',focus:'plain forms: う-verbs II, する, くる',
 story:'Mika lines up the rest: wait, ride, drink, play. Then she writes two verbs that follow no pattern at all: する and くる. They are the most common verbs in the language, and the only irregular ones.',
 note:{title:'The rest, and the two irregulars',html:"<p><b>ち → つ</b> まちます → まつ. <b>り → る</b> のります → のる. <b>み → む</b> のみます → のむ. <b>び → ぶ</b> あそびます → あそぶ. Irregular: <b>します → する</b>, <b>きます → くる</b>, <b>べんきょうします → べんきょうする</b>. Beware: <b>かえる</b> and <b>はいる</b> look like る-verbs but are う-verbs, so memorise them.</p>"},
 teaser:'Tomorrow you make the negative, and the cutlets are red with miso.'},
110:{title:'The ない Form',place:'A miso katsu restaurant',focus:'ない form: plain negative',
 story:'A waiter asks if you eat pork. The answer is no, and you want to say it in the plain form, because Mika has promised the next restaurant will be a casual one.',
 note:{title:'Making the ない form',html:"<p><b>る-verbs:</b> drop る, add ない: たべる → <b>たべない</b>. <b>う-verbs:</b> change the last sound to its あ-sound, add ない: かく → <b>かかない</b>, のむ → <b>のまない</b>, はなす → <b>はなさない</b>. Verbs ending in う use わ: かう → <b>かわない</b>. Irregular: する → <b>しない</b>, くる → <b>こない</b>, ある → <b>ない</b>. Polite: <b>たべないです</b> = たべません.</p>"},
 teaser:'The plates are cleared and the check is paid. Tomorrow: the past.'},
111:{title:'The た Form',place:'A chicken wings izakaya',focus:'た form: plain past',
 story:'Nagoya fried chicken wings, peppery, sticky, with beer. Mika asks what you did today, and your answer should be in the plain past.',
 note:{title:'Making the た form',html:"<p><b>る-verbs:</b> drop る, add た: たべる → <b>たべた</b>. <b>う-verbs</b> change by the last sound: <b>く → いた</b> かいた, <b>ぐ → いだ</b> およいだ, <b>す → した</b> はなした, <b>う・つ・る → った</b> かった, まった, のった, <b>む・ぶ・ぬ → んだ</b> のんだ, あそんだ. Exceptions: <b>いく → いった</b>, <b>する → した</b>, <b>くる → きた</b>.</p>"},
 teaser:'You walk off the pepper over a tram bridge. Tomorrow: the て form.'},
112:{title:'The て Form, Properly',place:'An old-style morning coffee shop',focus:'て form: rule and uses',
 story:'Breakfast in Nagoya means a coffee, thick toast and sweet red bean paste. Mika puts a て-form on the table and says: you have used these since Kamakura; now you learn the rule.',
 note:{title:'Making the て form',html:"<p>The て form follows the た form: た becomes て, だ becomes で. <b>たべて, みて</b>; <b>かいて, およいで, はなして, かって, まって, のって, のんで, あそんで</b>; exceptions <b>いって</b>, <b>して</b>, <b>きて</b>. You have met these uses: <b>〜て ください</b>, <b>〜て います</b>, <b>〜ても いい</b>.</p>"},
 teaser:'Breakfast over, you head for the harbour. Tomorrow: what you can do.'},
113:{title:'What Can You Do?',place:'Nagoya Port Aquarium',focus:'〜ことが できます: can do',
 story:'Dolphins and orcas, a penguin show and a huge tank. A trainer says she can make a dolphin jump. Mika asks what you can do.',
 note:{title:'Can do: こと が できます',html:"<p>Dictionary form + <b>こと が できます</b> means can do: <b>およぐ こと が できます。</b> I can swim. Negative: <b>できません</b>. Nouns work with が できます too: <b>にほんごが できます。</b> I can speak Japanese. Ability is often said by the particle <b>が</b>, not <b>を</b>.</p>"},
 teaser:'The aquarium closes and the rain returns. Tomorrow: have you ever?'},
114:{title:'Have You Ever?',place:'The Tokugawa Art Museum',focus:'〜た ことが あります: experience',
 story:'Swords, armour and scrolls once owned by the Tokugawa family. A guard asks whether you have ever seen a samurai sword. That is the sentence you are about to learn.',
 note:{title:'Have you ever: た こと が あります',html:"<p>た-form + <b>こと が あります</b>: <b>かまくらへ いった こと が あります。</b> I have been to Kamakura. Question: <b>ふじさんを みた こと が ありますか。</b> Negative: <b>ありません</b>.</p>"},
 teaser:'Mika says she has never tried the pottery workshop. Tomorrow: plans.'},
115:{title:'My Plan Is',place:'Noritake Garden',focus:'〜つもりです: intending to',
 story:'Plates, cups, and a factory where Nagoya porcelain is made. Mika asks what you plan to do tomorrow.',
 note:{title:'Plans: つもり',html:"<p>Dictionary form + <b>つもりです</b>: <b>あした きょうとへ いく つもりです。</b> I plan to go to Kyoto tomorrow. Negative uses the ない form: <b>いかない つもりです。</b> I plan not to go.</p>"},
 teaser:'The bus to Inuyama leaves early. Tomorrow: then, and while.'},
116:{title:'Then, and While',place:'Inuyama Castle town',focus:'〜てから, 〜ながら',
 story:'A small town with an old castle on a river. Mika suggests walking around, eating something on a stick, then climbing the keep.',
 note:{title:'After and while',html:"<p><b>〜てから</b> after doing: <b>ごはんを たべて から、でかけます。</b> After eating, I go out. <b>〜ながら</b> while doing: use the ます stem, <b>おんがくを ききながら あるきます。</b> I walk while listening to music. In both, the main action comes last.</p>"},
 teaser:'On the way back the train stops and does not move. Tomorrow: reasons.'},
117:{title:'Because',place:'A delayed train',focus:'から and ので: reasons',
 story:'The train stopped between two stations and an announcement says there has been an accident. Mika texts a friend: we will be late. Why? She has a sentence for that.',
 note:{title:'Reasons: から and ので',html:"<p><b>から</b> and <b>ので</b> both mean because. <b>あめですから、いえに います。</b> <b>ので</b> is softer: <b>でんしゃが おくれたので、ごめんなさい。</b> Before ので a noun or な-adjective takes <b>な</b>: <b>あめなので</b>. Ask why with <b>どうしてですか</b>.</p>"},
 teaser:'You arrive at the hotel after midnight. Tomorrow: what you think.'},
118:{title:'I Think, They Said',place:'The hotel lobby, Nagoya',focus:'〜と おもいます, 〜と いいました',
 story:'The receptionist says that tomorrow it will probably rain, and that the Shinkansen to Kyoto is full of people. She says it kindly. Mika asks what you think about it.',
 note:{title:'Thinking and reporting',html:"<p>Plain form + <b>と おもいます</b>: <b>あした あめが ふる と おもいます。</b> I think it will rain tomorrow. Plain form + <b>と いいました</b>: <b>せんせいは おもしろい と いいました。</b> The teacher said it was interesting. For nouns and な-adjectives plain present uses <b>だ</b>: <b>しずかだ と おもいます。</b></p>"},
 teaser:'Mika says goodnight in a way you have not heard before. Tomorrow: casual talk.'},
119:{title:'Talking Like Friends',place:'A hotel lounge',focus:'casual speech',
 story:'Mika puts her phone away and starts speaking casually. Friends drop です and ます, and the plain forms you learned this week come out at full speed.',
 note:{title:'Plain style',html:"<p>With friends, use plain forms: <b>たべる?</b> (rising) Do you eat? <b>うん、たべる。</b> Yes. <b>ううん、たべない。</b> No. <b>やっぱり いく。</b> I will go after all. <b>おいしかった。</b> It was delicious. Never use plain style with a teacher, a boss or a stranger. Keep ます there.</p>"},
 teaser:'Tomorrow is the checkpoint, and then the train to Kyoto.'},
120:{title:'Checkpoint at Nagoya Station',place:'Nagoya Station, the Shinkansen platform again',focus:'everything from Nagoya',
 story:'Back at the platform where you arrived thirty days ago. The same red trains and white shinkansen. Mika hands you a ticket for Kyoto. First, a checkpoint.',
 note:{title:'You have come a long way',html:"<p>One hundred and twenty days: both kana, over 670 words, 90 kanji and the plain form of verbs. This lesson is a long review of everything from Nagoya. It is a checkpoint made by Tabi, not an official JLPT test.</p>"},
 teaser:'The ticket says Kyoto, and a bullet train waits. Next region: Kyoto. (Coming in the next update.)'}
};

127:{title:'The Philosopher\'s Path',place:'The Philosopher\'s Path',focus:'週 間: week and interval',

135:{title:'Bargains on Teramachi',place:'Teramachi shopping arcade',focus:'好 安: like and cheap',
 story:'The arcade is full of shops and a sale sign on every one. Mika loves a bargain. You find something you like and read the price, 安い.',
 note:{title:'好き and 安い',html:"<p><b>好き</b> すき is a な-adjective: <b>すしが 好きです。</b> I like sushi. <b>大好き</b> だいすき is stronger. <b>安い</b> やすい is an い-adjective: cheap. Opposite of expensive: 高い.</p>"},

136:{title:'Can Do: The Potential Form',place:'A calligraphy workshop',focus:'potential form: can do',
 story:'A teacher hands you a brush. Writing your own name is hard. Mika shows you a shorter way to say I can write: one verb, not three words.',
 note:{title:'The potential form',html:"<p>The potential form says can. <b>る-verbs:</b> drop る, add <b>られる</b>: たべる → <b>たべられる</b>. <b>う-verbs:</b> change the last sound to its え-sound and add る: かく → <b>かける</b>, よむ → <b>よめる</b>, はなす → <b>はなせる</b>, かう → <b>かえる</b>. Irregular: する → <b>できる</b>, くる → <b>こられる</b>. The thing you can do takes が: <b>にほんごが はなせます。</b> I can speak Japanese. Polite: <b>かけます</b>, <b>たべられます</b>.</p>"},
 teaser:'The brush is heavy and the afternoon is quiet. Tomorrow: a day off.'},
137:{title:'Doing This and That',place:'The grounds of the Imperial Palace',focus:'〜たり〜たり: examples of actions',

 note:{title:'たり〜たり',html:"<p>た-form + <b>り</b>, twice, lists examples, and ends with <b>します</b>: <b>にちようびは ほんを よんだり、えいがを みたり します。</b> On Sundays I do things like read books and watch movies. Past: <b>〜たり〜たり しました</b>.</p>"},
 teaser:'A cold wind starts up. Tomorrow: advice.'},
138:{title:'You Should Rest',place:'Your hotel room',focus:'〜た ほうが いい: advice',

 teaser:'She is better by morning, and the temple has rules. Tomorrow: must.'},
139:{title:'What You Must Do',place:'A Zen temple',focus:'〜なければ なりません: must',
 story:'At the Zen temple there are rules: take your shoes off, keep quiet, do not photograph the garden. Mika reads them aloud and you learn to say we must.',
 note:{title:'Must, and need not',html:"<p>Take the ない form, drop <b>い</b>, add <b>ければ なりません</b>: <b>いかなければ なりません。</b> I must go. Need not: ない form, drop い, add <b>くても いいです</b>: <b>いかなくても いいです。</b> You do not have to go.</p>"},
 teaser:'Outside the sky has turned. Tomorrow: maybe.'},
140:{title:'It Might Rain',place:'The garden of a Zen temple',focus:'でしょう, かもしれません',
 story:'Clouds pile up over the hill. Mika checks the forecast, and then looks at the sky. She says it will probably rain, but she is not sure.',
 note:{title:'Probably and maybe',html:"<p>Plain form + <b>でしょう</b> means probably: <b>あしたは あめでしょう。</b> Plain form + <b>かもしれません</b> means might: <b>あめが ふる かもしれません。</b> After a noun or な-adjective there is no だ: <b>あめかもしれません</b>, <b>しずかかもしれません</b>.</p>"},
 teaser:'A sweet shop appears, just in time. Tomorrow: it looks tasty.'},
141:{title:'Looks Delicious',place:'A Kyoto sweet shop',focus:'〜そうです: looks like',
 story:'Yatsuhashi in every flavour, soft mochi, and sweet bean jelly cut into small bricks. Everything looks good, and Mika has a sentence for it.',
 note:{title:'Looks like: そう',html:"<p>い-adjective without い + <b>そう</b>: <b>おいしそうです。</b> It looks delicious. ます-stem + そう: <b>ふりそうです。</b> It looks like it will rain. Exception: <b>いい → よさそう</b>. Do not confuse with plain form + そうです, which means I heard that.</p>"},
 teaser:'You can only eat so much. Tomorrow: deciding.'},
142:{title:'I Decided To',place:'A Kyoto cafe',focus:'〜ことに します: deciding',

 note:{title:'Deciding: ことに する',html:"<p>Dictionary form + <b>ことに します</b> means decide to. <b>ことに しました</b> means decided to: <b>まいにち にほんごを べんきょうする ことに しました。</b> I decided to study Japanese every day.</p>"},
 teaser:'Your bag is heavy and the trains are crowded. Tomorrow: when.'},
143:{title:'When I Travel',place:'Kyoto Station coin lockers',focus:'〜とき: when',
 story:'The station is crowded. You put your luggage in a coin locker and keep your passport. Mika says: when you travel, always keep your passport with you.',
 note:{title:'When: とき',html:"<p>Plain form + <b>とき</b>: <b>りょこうする とき、パスポートを もって いきます。</b> When I travel, I take my passport. Past: <b>りょこうした とき</b>. Nouns need の: <b>やすみの とき</b>. な-adjectives need な: <b>ひまな とき</b>.</p>"},
 teaser:'The last tram leaves in five minutes. Tomorrow: if.'},
144:{title:'If It Rains',place:'Kyoto Tower',focus:'〜たら: if, when',

 note:{title:'If: たら',html:"<p>た-form + <b>ら</b> means if or when: <b>あめが ふったら、いきません。</b> If it rains, we will not go. It works with adjectives too: <b>やすかったら、かいます。</b> If it is cheap, I will buy it.</p>"},
